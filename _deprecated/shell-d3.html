<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jessica Stahl's Climate Picks — Independent Journalism Atlas</title>
<meta name="description" content="22 independent climate and environment creators recommended by journalist and editor Jessica Stahl — covering the climate crisis, energy transition, and environmental accountability.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/variables.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&display=swap');

:root {
  --acid:       #ceff00;
  --lime:       #97d600;
  --olive:      #5d7400;
  --page-bg:    #efeff2;
  --border:     #d4d4d8;
  --nav-height: 56px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: 'Hanken Grotesk', sans-serif;
  background: var(--page-bg);
  color: #313131;
  line-height: 1.5;
  overflow-x: hidden;
  padding-top: 72px;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

.container { width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 40px; }

/* ── HERO — black, single column ── */
.hero { background: #000; padding: 88px 0 72px; }
.hero-eyebrow { font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--acid); margin-bottom: 20px; }
.hero-h1 { font-size: 44px; font-weight: 700; line-height: 52px; letter-spacing: -0.5px; color: #fff; margin-bottom: 20px; }
.hero-body { font-size: 17px; font-weight: 400; line-height: 28px; color: rgba(255,255,255,0.72); max-width: 600px; margin-bottom: 32px; }
.hero-meta { font-size: 12px; font-weight: 500; letter-spacing: 0.06em; color: rgba(255,255,255,0.35); margin-bottom: 12px; }
.hero-collab { font-size: 13px; font-weight: 500; letter-spacing: 0.05em; color: rgba(255,255,255,0.4); }

/* ── FILTER BAR — white, sticky ── */
.filter-bar {
  position: sticky;
  top: var(--nav-height);
  z-index: 90;
  background: #fff;
  border-bottom: 0.5px solid var(--border);
  padding: 16px 0;
}
.filter-bar-inner { max-width: 1040px; margin: 0 auto; padding: 0 40px; }
.filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-row + .filter-row { margin-top: 10px; }
.filter-label {
  font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
  color: #888; white-space: nowrap; min-width: 100px;
}
.chip {
  display: inline-flex; align-items: center;
  padding: 5px 14px; border-radius: 100px;
  font-size: 12px; font-weight: 500;
  background: var(--page-bg); border: 0.5px solid var(--border); color: #313131;
  cursor: pointer; transition: background 0.12s, border-color 0.12s, color 0.12s;
  user-select: none;
}
.chip:hover { background: #e4e4e9; border-color: #b0b0b8; }
.chip.active { background: var(--lime); border-color: var(--olive); color: #313131; }
.chip:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

/* ── GRID SECTION ── */
.grid-section { background: var(--page-bg); padding: 64px 0; }
.grid-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 32px; }
.grid-h2 { font-size: 28px; font-weight: 700; color: #000; letter-spacing: -0.25px; }
.grid-count { font-size: 13px; font-weight: 500; color: #888; letter-spacing: 0.04em; }

.creator-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

/* ── CREATOR CARD ── */
.creator-card {
  background: #fff;
  border: 0.5px solid var(--border);
  border-radius: 6px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  transition: background 0.15s, border-color 0.15s;
}
.creator-card:hover { background: #efeff2; border-color: #b0b0b8; }
.creator-name { font-size: 18px; font-weight: 700; color: #000; line-height: 1.3; margin-bottom: 4px; }
.creator-channel { font-size: 14px; font-weight: 500; color: var(--olive); margin-bottom: 12px; }
.creator-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 12px; border-radius: 100px;
  font-size: 12px; font-weight: 500;
  background: #efeff2; border: 0.5px solid var(--border); color: #313131;
}
.pill.platform { background: var(--lime); border-color: var(--olive); }
.pill .material-symbols-outlined {
  font-size: 14px; line-height: 1;
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 14;
}
.card-divider { border: none; border-top: 0.5px solid var(--border); margin-bottom: 16px; }
.card-link {
  font-size: 14px; font-weight: 500; color: var(--olive);
  margin-top: auto;
  display: inline-flex; align-items: center;
  padding: 6px 12px; border-radius: 6px; margin-left: -12px;
  transition: color 0.15s, background 0.15s;
}
.card-link:hover { color: #313131; background: var(--lime); }
.card-link:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

/* ── EMPTY STATE ── */
.empty-state { grid-column: 1 / -1; padding: 64px 0; text-align: center; color: #888; font-size: 16px; }

/* ── ABOUT SECTION — white ── */
.about-rule { border: none; border-top: 1px solid var(--border); margin: 0; }
.about-section { background: #fff; padding: 80px 0; }
.about-inner { max-width: 640px; }
.about-text-name { font-size: 28px; font-weight: 700; color: #000; letter-spacing: -0.25px; margin-bottom: 24px; line-height: 1.2; }
.about-headline { font-size: 28px; font-weight: 700; color: #000; letter-spacing: -0.25px; margin-bottom: 16px; }
.about-body { font-size: 16px; font-weight: 400; line-height: 26px; color: #444; margin-bottom: 20px; }
.about-link { font-size: 14px; font-weight: 500; color: var(--olive); transition: color 0.15s; }
.about-link:hover { color: #000; }

/* ── ATLAS FOOTER — dark gray ── */
.atlas-footer { background: #313131; padding: 80px 0; }
.atlas-footer-inner { display: flex; flex-direction: column; align-items: flex-start; gap: 20px; }
.atlas-footer-logo img { height: 20px; width: auto; }
.atlas-footer-tagline { font-size: 16px; font-weight: 400; line-height: 26px; color: rgba(255,255,255,0.65); max-width: 480px; }
.atlas-footer-btn {
  display: inline-flex; align-items: center;
  padding: 12px 24px;
  background: var(--acid); color: #000;
  font-family: 'Hanken Grotesk', sans-serif;
  font-size: 14px; font-weight: 700; border-radius: 6px;
  transition: opacity 0.15s; margin-top: 4px;
}
.atlas-footer-btn:hover { opacity: 0.88; }
.atlas-footer-btn:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: var(--page-bg); }
::-webkit-scrollbar-thumb { background: var(--border); }

@media (max-width: 768px) {
  .hero { padding: 56px 0 48px; }
  .hero-h1 { font-size: 32px; line-height: 40px; }
  .hero-body { font-size: 16px; }
  .creator-grid { grid-template-columns: 1fr; }
  .filter-label { min-width: 80px; font-size: 10px; }
}

@media (max-width: 480px) {
  .container { padding: 0 20px; }
  .filter-bar-inner { padding: 0 20px; }
  .hero { padding: 48px 0 40px; }
  .hero-h1 { font-size: 26px; line-height: 34px; }
  .grid-section { padding: 48px 0; }
  .about-section { padding: 56px 0; }
  .atlas-footer { padding: 56px 0; }
}
</style>
<link rel="stylesheet" href="/assets/css/header.css">
</head>
<body>
<script src="/assets/js/header.js"></script>

<!-- HERO -->
<section class="hero">
  <div class="container" id="hero-content"></div>
</section>

<!-- FILTER BAR -->
<div class="filter-bar">
  <div class="filter-bar-inner" id="filter-bar-inner"></div>
</div>

<!-- GRID SECTION -->
<section class="grid-section">
  <div class="container">
    <div class="grid-header">
      <h2 class="grid-h2" id="grid-heading"></h2>
      <span class="grid-count" id="grid-count"></span>
    </div>
    <div class="creator-grid" id="creator-grid"></div>
  </div>
</section>

<!-- ABOUT -->
<div class="about-rule"></div>
<section class="about-section">
  <div class="container">
    <div class="about-inner" id="about-inner"></div>
  </div>
</section>

<!-- ATLAS FOOTER -->
<footer class="atlas-footer">
  <div class="container">
    <div class="atlas-footer-inner">
      <div class="atlas-footer-logo">
        <img src="../assets/images/logos/Journalism_Atlas_wordmark_horizontal_lockup_white.png" alt="Independent Journalism Atlas">
      </div>
      <p class="atlas-footer-tagline">Discover 1,700+ independent creator-journalists across newsletters, video, podcasts, and social.</p>
      <a href="https://journalismatlas.com" class="atlas-footer-btn">Explore the Atlas &rarr;</a>
    </div>
  </div>
</footer>

<script>
const PARTNER_CONFIG = {
  curatorName:    'Jessica Stahl',
  curatorChannel: 'Climate journalist & editor',
  curatorUrl:     'https://jessicastahl.substack.com',
  curatorNote:    'Jessica Stahl covers climate, energy, and environmental policy. This list is the independent creator layer she watches for reporting that moves faster than institutional outlets — and reaches audiences traditional journalism doesn’t.',
  pageTitle:      "Jessica Stahl’s Climate Picks — Independent Journalism Atlas",
  pageDescription:'22 independent climate and environment creators recommended by journalist and editor Jessica Stahl — covering the climate crisis, energy transition, and environmental accountability.',
  pageUrl:        'https://journalismatlas.com/partners/jessica-stahl',
  logoColor:      null,
  aboutHeadline:  'About Jessica Stahl',
  aboutParagraphs: [
    'Jessica Stahl is a climate journalist and editor who has spent her career tracking the independent voices doing the most important work on the climate crisis. Her focus spans the energy transition, environmental accountability, and solutions journalism — elevating creators who bring rigor, nuance, and urgency to climate coverage.',
    'This curated list is part of an ongoing collaboration between Jessica Stahl and the Independent Journalism Atlas. Together, we are working to make the best independent climate journalism easier to find and follow.',
  ],
  aboutLinkText: 'Follow Jessica Stahl',
  aboutLinkUrl:  'https://jessicastahl.substack.com',

  creators: [
    { name: 'Amanda Royal',         channel: 'Amanda Royal',        link: 'https://amandaroyal.substack.com',     platform: 'Newsletter - Substack', topic: 'Climate/Environment' },
    { name: 'Andy Revkin',          channel: 'Sustain What',        link: 'https://revkin.substack.com',          platform: 'Newsletter - Substack', topic: 'Climate/Environment' },
    { name: 'Caroline Saunders',    channel: 'Caroline Saunders',   link: 'https://carolinesaunders.substack.com',platform: 'Newsletter - Substack', topic: 'Solutions Journalism' },
    { name: "Chris D'angelo",       channel: "Chris D'angelo",      link: 'https://chrisdangelo.substack.com',    platform: 'Newsletter - Substack', topic: 'Climate/Environment' },
    { name: 'Dana Drugmand',        channel: 'Dana Drugmand',       link: 'https://danadrugmand.substack.com',    platform: 'Newsletter - Substack', topic: 'Climate/Environment' },
    { name: 'David Roberts',        channel: 'Volts',               link: 'https://www.volts.wtf',                platform: 'Newsletter - Ghost',    topic: 'Energy' },
    { name: 'Emily Sanders',        channel: 'Emily Sanders',       link: 'https://emilysanders.substack.com',    platform: 'Newsletter - Substack', topic: 'Climate/Environment' },
    { name: 'Jacob Simon',          channel: 'Jacob Simon',         link: 'https://jacobsimon.substack.com',      platform: 'Newsletter - Substack', topic: 'Energy' },
    { name: 'Jonathan P. Thompson', channel: 'Land Desk',           link: 'https://landdesk.org',                 platform: 'Newsletter - Other',    topic: 'Climate/Environment' },
    { name: 'Katharine Hayhoe',     channel: 'Katharine Hayhoe',   link: 'https://katharinehayhoe.substack.com', platform: 'Newsletter - Substack', topic: 'Climate/Environment' },
    { name: 'Laura Paskus',         channel: 'Laura Paskus',        link: 'https://laurapaskus.substack.com',     platform: 'Newsletter - Substack', topic: 'Climate/Environment' },
    { name: 'Mike Shanahan',        channel: 'Mike Shanahan',       link: 'https://mikeshanahan.substack.com',    platform: 'Newsletter - Substack', topic: 'Climate/Environment' },
    { name: 'Miranda Green',        channel: 'Miranda Green',       link: 'https://mirandagreen.substack.com',    platform: 'Newsletter - Substack', topic: 'Energy' },
    { name: 'Navya Singh',          channel: 'Navya Singh',         link: 'https://navyasingh.substack.com',      platform: 'Newsletter - Substack', topic: 'Climate/Environment' },
    { name: 'Neelima Vallangi',     channel: 'Neelima Vallangi',    link: 'https://neelima.substack.com',         platform: 'Newsletter - Substack', topic: 'Climate/Environment' },
    { name: 'Rachel Donald',        channel: 'Planet: Critical',    link: 'https://www.planetcritical.com',       platform: 'Newsletter - Ghost',    topic: 'Climate/Environment' },
    { name: 'Sammy Roth',           channel: 'Boiling Point',       link: 'https://sammyroth.substack.com',       platform: 'Newsletter - Substack', topic: 'Energy' },
    { name: 'Sophia Li',            channel: 'Sophia Li',           link: 'https://sophiali.substack.com',        platform: 'Newsletter - Substack', topic: 'Solutions Journalism' },
    { name: 'Vince Beiser',         channel: 'Vince Beiser',        link: 'https://vincebeiser.substack.com',     platform: 'Newsletter - Substack', topic: 'Climate/Environment' },
    { name: 'Whitney Bauck',        channel: 'Unmaking',            link: 'https://whitneybauck.substack.com',    platform: 'Newsletter - Substack', topic: 'Climate/Environment' },
    { name: 'Zeke Hausfather',      channel: 'Climate Unconfused',  link: 'https://zeke.substack.com',            platform: 'Newsletter - Substack', topic: 'Climate/Environment' },
    { name: 'John Earl',            channel: 'John Earl',           link: 'https://johnearl.substack.com',        platform: 'Newsletter - Beehiiv',  topic: 'Energy' },
  ],
};

/* ── UTILITIES ── */
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function getPlatformInfo(platform) {
  const map = {
    'Newsletter - Substack': { icon: 'mail', name: 'Substack'   },
    'Newsletter - Beehiiv':  { icon: 'mail', name: 'Beehiiv'    },
    'Newsletter - Ghost':    { icon: 'mail', name: 'Ghost'      },
    'Newsletter - Other':    { icon: 'mail', name: 'Newsletter' },
    'Video - YouTube':       { icon: 'play_circle', name: 'YouTube'   },
    'Podcast':               { icon: 'podcasts',    name: 'Podcast'   },
    'Website':               { icon: 'language',    name: 'Website'   },
  };
  if (map[platform]) return map[platform];
  if (platform && platform.startsWith('Social')) return { icon: 'alternate_email', name: platform.replace('Social - ', '') };
  return { icon: 'language', name: platform || '' };
}

/* ── RENDER HERO ── */
function renderHero() {
  const { creators, curatorName, curatorNote } = PARTNER_CONFIG;
  const uniqueTopics    = new Set(creators.map(c => c.topic)).size;
  const uniquePlatforms = new Set(creators.map(c => c.platform)).size;

  document.getElementById('hero-content').innerHTML = `
    <p class="hero-eyebrow">A Curated List from ${esc(curatorName)}</p>
    <h1 class="hero-h1">Jessica Stahl’s Climate Picks</h1>
    <p class="hero-body">${esc(curatorNote)}</p>
    <p class="hero-meta">${uniqueTopics} topics &middot; ${uniquePlatforms} platforms</p>
    <p class="hero-collab">Curated by ${esc(curatorName)} &times; Independent Journalism Atlas</p>
  `;
}

/* ── RENDER FILTER BAR ── */
function renderFilterBar() {
  const { creators } = PARTNER_CONFIG;
  const topics    = [...new Set(creators.map(c => c.topic))].sort();
  const platforms = [...new Set(creators.map(c => c.platform))].sort();

  function chipsHTML(values, dimension) {
    const allChip = `<button class="chip active" data-dimension="${esc(dimension)}" data-value="">All</button>`;
    const rest = values.map(v =>
      `<button class="chip" data-dimension="${esc(dimension)}" data-value="${esc(v)}">${esc(v)}</button>`
    ).join('');
    return allChip + rest;
  }

  document.getElementById('filter-bar-inner').innerHTML = `
    <div class="filter-row">
      <span class="filter-label">By topic</span>
      ${chipsHTML(topics, 'topic')}
    </div>
    <div class="filter-row">
      <span class="filter-label">By platform</span>
      ${chipsHTML(platforms, 'platform')}
    </div>
  `;
}

/* ── RENDER CREATOR GRID ── */
function renderGrid() {
  const { creators, curatorName } = PARTNER_CONFIG;
  document.getElementById('grid-heading').textContent = `${curatorName}’s Picks`;

  document.getElementById('creator-grid').innerHTML = creators.map(c => {
    const { icon, name: platformName } = getPlatformInfo(c.platform);
    const geoHTML   = c.geography ? `<span class="pill">${esc(c.geography)}</span>` : '';
    const topicHTML = c.topic     ? `<span class="pill">${esc(c.topic)}</span>`     : '';
    return `
      <div class="creator-card" data-topic="${esc(c.topic)}" data-platform="${esc(c.platform)}">
        <div class="creator-name">${esc(c.name)}</div>
        <div class="creator-channel">${esc(c.channel)}</div>
        <div class="creator-pills">
          ${geoHTML}
          ${topicHTML}
          <span class="pill platform">
            <span class="material-symbols-outlined">${icon}</span>${esc(platformName)}
          </span>
        </div>
        <hr class="card-divider">
        <a href="${esc(c.link)}" target="_blank" rel="noopener" class="card-link">Visit &rarr;</a>
      </div>
    `;
  }).join('');
}

/* ── RENDER ABOUT ── */
function renderAbout() {
  const { curatorName, logoColor, aboutHeadline, aboutParagraphs, aboutLinkText, aboutLinkUrl } = PARTNER_CONFIG;
  const logoHTML  = logoColor
    ? `<div class="about-logo"><img src="${esc(logoColor)}" alt="${esc(curatorName)}"></div>`
    : `<p class="about-text-name">${esc(curatorName)}</p>`;
  const parasHTML = aboutParagraphs.map(p => `<p class="about-body">${esc(p)}</p>`).join('');
  document.getElementById('about-inner').innerHTML = `
    ${logoHTML}
    <h2 class="about-headline">${esc(aboutHeadline)}</h2>
    ${parasHTML}
    <a href="${esc(aboutLinkUrl)}" target="_blank" rel="noopener" class="about-link">${esc(aboutLinkText)} &nearr;</a>
  `;
}

/* ── FILTER LOGIC ── */
function initFilters() {
  const cards   = Array.from(document.querySelectorAll('.creator-card'));
  const countEl = document.getElementById('grid-count');
  const total   = cards.length;
  let activeTopic    = null;
  let activePlatform = null;

  function applyFilters() {
    let visible = 0;
    cards.forEach(card => {
      const topicMatch    = !activeTopic    || card.dataset.topic    === activeTopic;
      const platformMatch = !activePlatform || card.dataset.platform === activePlatform;
      const show = topicMatch && platformMatch;
      card.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    countEl.textContent = `Showing ${visible} of ${total} creators`;

    const emptyEl = document.getElementById('empty-state');
    if (visible === 0) {
      if (!emptyEl) {
        const el = document.createElement('p');
        el.id = 'empty-state';
        el.className = 'empty-state';
        el.textContent = 'No creators match these filters.';
        document.getElementById('creator-grid').appendChild(el);
      }
    } else if (emptyEl) {
      emptyEl.remove();
    }
  }

  function updateChipState(dimension, value) {
    document.querySelectorAll(`.chip[data-dimension="${dimension}"]`).forEach(chip => {
      chip.classList.toggle('active', chip.dataset.value === value);
    });
  }

  document.getElementById('filter-bar-inner').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const { dimension, value } = chip.dataset;

    if (dimension === 'topic') {
      if (activeTopic === value || value === '') {
        activeTopic = null;
        updateChipState('topic', '');
      } else {
        activeTopic = value;
        updateChipState('topic', value);
      }
    } else if (dimension === 'platform') {
      if (activePlatform === value || value === '') {
        activePlatform = null;
        updateChipState('platform', '');
      } else {
        activePlatform = value;
        updateChipState('platform', value);
      }
    }
    applyFilters();
  });

  applyFilters();
}

/* ── INIT ── */
document.addEventListener('DOMContentLoaded', () => {
  document.title = PARTNER_CONFIG.pageTitle;
  document.querySelector('meta[name="description"]').setAttribute('content', PARTNER_CONFIG.pageDescription);
  renderHero();
  renderFilterBar();
  renderGrid();
  renderAbout();
  initFilters();
});
</script>
</body>
</html>
