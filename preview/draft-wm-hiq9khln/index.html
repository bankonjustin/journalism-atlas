<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Draft</title>
<link rel="stylesheet" href="/assets/css/variables.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@500&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--color-surface);color:var(--color-text);font-family:var(--font-primary);font-size:var(--text-body);line-height:1.6}
main{max-width:680px;margin:0 auto;padding:var(--space-xl) var(--space-lg) var(--space-3xl)}
.wide{width:min(960px,calc(100vw - 48px));margin-left:50%;transform:translateX(-50%);overflow-x:auto}
h1,h2{font-family:var(--font-heading);color:var(--color-heading);font-weight:700}
h1{font-size:var(--text-display);line-height:var(--lh-display);letter-spacing:var(--ls-display);margin:0 0 var(--space-md)}
h2{font-size:var(--text-h2);line-height:var(--lh-h2);margin:var(--space-2xl) 0 var(--space-md)}
p{margin:0 0 var(--space-md)}
a{color:var(--color-link);text-decoration:underline;text-underline-offset:3px}
a:hover{color:var(--color-heading)}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--color-focus-on-light);outline-offset:2px}
.masthead{border-top:6px solid var(--color-heading);padding-top:var(--space-md);margin-bottom:var(--space-lg)}
.draftnote{font-family:var(--font-mono);font-weight:500;font-size:var(--text-label);line-height:var(--lh-label);letter-spacing:.1em;text-transform:uppercase;color:var(--color-text-secondary);margin:0 0 var(--space-lg)}
.dek{font-size:var(--text-h3);line-height:var(--lh-h3);margin:0 0 var(--space-md)}
.byline{font-weight:700;margin:0}
.lede{font-size:var(--text-h3);line-height:var(--lh-h3)}
.kicker{font-size:var(--text-h3);line-height:var(--lh-h3);font-weight:600;color:var(--color-heading);border-left:6px solid var(--color-heading);padding-left:var(--space-lg);margin:var(--space-xl) 0}
figure{margin:var(--space-xl) 0}
figure.hero{margin-top:var(--space-sm)}
figcaption{margin-bottom:var(--space-sm)}
.chart{overflow-x:auto}
svg{display:block;width:100%;height:auto;min-width:720px;font-family:var(--font-primary)}
.svg-row{font-size:20px;font-weight:700;fill:var(--color-heading)}
.svg-n{font-weight:400;fill:var(--color-text-secondary)}
.svg-val{font-family:var(--font-primary);font-size:20px;font-weight:700}
.svg-leg{font-size:18px;fill:var(--color-text-secondary)}
.seg{stroke:var(--color-surface);stroke-width:2}
.k-blue{fill:var(--viz-blue)}.k-rust{fill:var(--viz-rust)}.k-gold{fill:var(--viz-gold)}
.k-g4{fill:var(--gray-neutral-4)}.k-g3{fill:var(--gray-neutral-3)}.k-g2{fill:var(--gray-neutral-2)}
.t-w{fill:var(--color-white)}.t-ink{fill:var(--color-heading)}
.source,.note{font-size:var(--text-small);line-height:var(--lh-small);color:var(--color-text-secondary);margin-top:var(--space-sm)}
table.data{width:100%;border-collapse:collapse;font-size:var(--text-small);line-height:var(--lh-small);margin:var(--space-md) 0 var(--space-sm)}
.data th{text-align:left;font-weight:700;color:var(--color-heading);border-bottom:2px solid var(--color-heading);padding:var(--space-sm) var(--space-sm) var(--space-sm) 0;vertical-align:bottom}
.data td{border-bottom:1px solid var(--color-border);padding:10px var(--space-sm) 10px 0;vertical-align:top}
.data .n{text-align:right}
.data td.hot{font-weight:700;color:var(--color-heading)}
.data .sub{display:block;color:var(--color-text-secondary)}
#events{min-width:820px}.cases,.p1{min-width:620px}.lvl{min-width:560px}
.sortable th button{all:unset;cursor:pointer;font:inherit;font-weight:700;color:inherit;display:inline-flex;gap:var(--space-xs);align-items:center}
.sortable th button:hover{text-decoration:underline}
.sortable th button:focus-visible{outline:2px solid var(--color-focus-on-light);outline-offset:2px}
.sortable th[aria-sort="ascending"] button::after{content:"\2191"}
.sortable th[aria-sort="descending"] button::after{content:"\2193"}
.chip{display:inline-block;font-family:var(--font-mono);font-weight:500;font-size:var(--text-tag);line-height:1.4;letter-spacing:.08em;text-transform:uppercase;padding:1px var(--space-sm);border-radius:var(--radius-pill);white-space:nowrap;border:1px solid var(--color-border-hover);color:var(--color-text);background:var(--color-surface)}
.chip.warn{border-color:var(--color-heading);color:var(--color-heading)}
#events .chip.warn{margin-left:var(--space-xs)}
#gate{max-width:460px;margin:18vh auto;padding:0 var(--space-lg)}
#gate h1{font-size:var(--text-h1);line-height:var(--lh-h1)}
#gate p{color:var(--color-text-secondary)}
#gate form{display:flex;gap:var(--space-sm);margin-top:var(--space-lg)}
#gate label{position:absolute;left:-9999px}
#gate input{flex:1;min-height:44px;font:inherit;padding:0 var(--space-md);border:2px solid var(--color-heading);border-radius:var(--radius-base)}
#gate button{min-height:44px;font-family:var(--font-primary);font-size:var(--text-button);font-weight:600;padding:0 var(--space-lg);border:1px solid var(--color-button-outline);border-radius:var(--radius-base);background:var(--color-button);color:var(--color-white);cursor:pointer}
#gate button:hover{background:var(--color-acid);color:var(--color-heading)}
#err{color:var(--color-error);min-height:1.5em}
@media (max-width:600px){h1{font-size:var(--text-h1);line-height:var(--lh-h1)}.dek,.lede,.kicker{font-size:var(--text-body);line-height:var(--lh-body-lg)}h2{font-size:var(--text-h3);line-height:var(--lh-h3)}}
</style></head>
<body>
<div id="gate">
  <h1>Draft</h1>
  <p>This draft is shared privately. Enter the password to read it.</p>
  <form id="f"><label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus><button type="submit">Open draft</button></form>
  <p id="err" role="alert"></p>
</div>
<main id="doc" hidden></main>

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(SALT),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:d(IV)},k,d(CT)));
}
function sortable(t){
  const heads=[...t.querySelectorAll('th')];
  heads.forEach((th,i)=>{
    th.setAttribute('aria-sort','none');
    th.querySelector('button').addEventListener('click',()=>{
      const b=t.tBodies[0],asc=th.getAttribute('aria-sort')!=='ascending';
      heads.forEach(h=>h.setAttribute('aria-sort','none'));
      th.setAttribute('aria-sort',asc?'ascending':'descending');
      [...b.rows].sort((x,y)=>x.cells[i].innerText.localeCompare(y.cells[i].innerText,undefined,{numeric:true})*(asc?1:-1)).forEach(r=>b.appendChild(r));
    });
  });
}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  if(!(window.crypto&&crypto.subtle)){document.getElementById('err').textContent='This browser cannot decrypt on this address. Open the page over https, or on localhost.';return;}
  try{const h=await unlock(document.getElementById('pw').value);
    const m=document.getElementById('doc');m.innerHTML=h;m.hidden=false;document.getElementById('gate').remove();
    document.querySelectorAll('table.sortable').forEach(sortable);window.scrollTo(0,0);}
  catch(e){document.getElementById('err').textContent='That password didn’t work. Check it and try again.';}
});
