<style>
:root{color-scheme:light;--font:Arial,Helvetica,sans-serif;--bg:#FFFFFF;--bg-2:#F4F4F4;--ink:#191919;--ink-2:#484848;--grid:#E8E8E8;--rule:#D0D0D0;
--dot:#191919;--focus:#8C1D40}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
.fig{margin:0;padding:clamp(12px,3vw,24px);max-width:1200px}
.cap{display:flex;gap:.9rem;align-items:baseline;justify-content:space-between;flex-wrap:wrap;margin:0 0 1.2rem}
.title{font-weight:800;letter-spacing:-.025em;font-size:clamp(1.15rem,2.2vw,1.6rem);line-height:1.1;margin:0;max-width:40rem}
.no{font-weight:700;font-size:.85rem;background:var(--ink);color:var(--bg);padding:.2em .5em}
/* desktop chart */
.chart{position:relative}
.axis{position:relative;height:28px;margin-left:var(--gut);border-bottom:1px solid var(--rule)}
.yr{position:absolute;top:0;transform:translateX(-50%);font-weight:700;font-size:13px;color:var(--ink-2)}
.plot{position:relative}
.grid{position:absolute;top:0;bottom:0;left:var(--gut);right:0;pointer-events:none}
.gl{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.chart{--gut:0px}
.lane{position:relative}
.lane-h{position:relative;margin:0;padding:8px 10px;background:var(--bg-2);font-weight:800;font-size:15px;border-top:3px solid var(--ink)}
.ev{position:relative;padding:12px 0 10px;border-bottom:1px solid var(--grid)}
.dot{position:absolute;top:17px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:var(--dot)}
.lab p{margin:0}
.ev.l .lab{text-align:right}
.what{font-weight:700;font-size:15px;line-height:1.3}
.when{font-weight:700;color:var(--ink-2);white-space:nowrap}
/* phone list */
.m{display:none}
.m-lane-h{font-weight:800;font-size:1rem;margin:1.2rem 0 .4rem;padding-bottom:.3rem;border-bottom:3px solid var(--ink)}
.m ol{list-style:none;margin:0;padding:0}
.m li{display:grid;grid-template-columns:5.2rem 1fr;gap:2px 12px;padding:.6rem 0;border-bottom:1px solid var(--rule)}
.m-when{font-weight:800;font-size:.85rem;color:var(--ink-2)}
.m-what{font-weight:700;font-size:1rem;line-height:1.25}
@media (max-width:520px){.chart{display:none}.m{display:block}}
.cut{font-weight:500;font-size:.95rem;line-height:1.45;color:var(--ink-2);margin:1.2rem 0 0;max-width:46rem}
details{margin:.9rem 0 0;font-size:.88rem}
summary{font-weight:700;cursor:pointer}
.tw{overflow-x:auto}
table{border-collapse:collapse;margin-top:.6rem;min-width:640px}
th,td{text-align:left;padding:.35rem .6rem .35rem 0;border-bottom:1px solid var(--rule);vertical-align:top}
a{color:var(--ink)}
a:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.note{font-weight:500;font-size:.88rem;line-height:1.45;color:var(--ink-2);margin:.8rem 0 0}
.credit{font-weight:500;font-size:.78rem;line-height:1.4;color:var(--ink-2);margin:1.2rem 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
