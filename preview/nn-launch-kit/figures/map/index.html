<style>
:root{color-scheme:light;--font:Arial,Helvetica,sans-serif;--bg:#FFFFFF;--bg-2:#F4F4F4;--ink:#191919;--ink-2:#484848;--rule:#D0D0D0;--maroon:#8C1D40;--gold:#FFC627;--num:#8C1D40;--head-bg:#8C1D40;--head-ink:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
.fig{margin:0;padding:clamp(12px,3vw,24px) clamp(12px,3vw,24px) 0;max-width:1200px}
.cap{display:flex;gap:.9rem;align-items:baseline;justify-content:space-between;flex-wrap:wrap;margin:0 0 1.2rem}
.title{font-weight:800;letter-spacing:-.025em;font-size:clamp(1.15rem,2.2vw,1.6rem);line-height:1.1;margin:0;max-width:40rem}
.no{font-weight:700;font-size:.85rem;background:var(--ink);color:var(--bg);padding:.2em .5em}
.grid{display:grid;gap:14px}
.grp{margin:0}
.grp-h{margin:0 0 8px;padding:8px 12px;background:var(--head-bg);color:var(--head-ink);font-weight:700;font-size:15px;line-height:1.25;border-left:6px solid var(--gold)}
.row{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cell{border:1px solid var(--rule);border-top:3px solid var(--ink);padding:10px 12px 12px;background:var(--bg);min-width:0}
.code{display:block;font-weight:700;font-size:12.5px;letter-spacing:.04em;color:var(--ink-2)}
.name{margin:2px 0 6px;font-weight:700;font-size:16px;line-height:1.2;overflow-wrap:break-word}

.total{margin:14px 0 0;font-weight:700;font-size:1rem}
.credit{font-weight:500;font-size:.78rem;line-height:1.4;color:var(--ink-2);margin:1.2rem 0 0}
@media (max-width:640px){.row{grid-template-columns:1fr}}

<body data-fig="fig-2-map">
<figure class="fig" aria-labelledby="t">
<div class="cap"><p class="title" id="t">The nine cohorts, in three groups</p><span class="no">Figure 2</span></div>
<div class="grid" id="grid" role="group"></div>
<noscript><p class="gov">Nine cohorts of U.S. journalism organizations in three groups. Turn on JavaScript to see the grid, or read the cohort descriptions in the report.</p></noscript>
<p class="total" id="total"></p>
</figure>
<script type="application/json" id="nn-data">{"groups": [{"label": "Reporters, outlets, bylines", "cohorts": ["C1", "C2", "C3"]}, {"label": "Public-interest funding infrastructure", "cohorts": ["C4", "C5", "C6"]}, {"label": "Funded directly by audiences and markets", "cohorts": ["C7", "C8", "C9"]}], "cohorts": [{"code": "C1", "name": "Legacy Publishers and Freelance Networks", "n": 17, "gov": "Institutional news organizations and the freelance economy that feeds them."}, {"code": "C2", "name": "Poly-Platform Creator Brands", "n": 26, "gov": "Individuals or small teams who own and run their operation."}, {"code": "C3", "name": "Barbell Hybrids", "n": 8, "gov": "Staff journalists running independent platforms alongside institutional jobs."}, {"code": "C4", "name": "Philanthropic Mesh Networks", "n": 45, "gov": "Foundation-funded nonprofit newsrooms governed by independent boards."}, {"code": "C5", "name": "Public Media Networks", "n": 14, "gov": "Public radio and TV stations held by university, community or state licensees."}, {"code": "C6", "name": "Collaboration and Coordination Layers", "n": 8, "gov": "Reporting collaborations and the organizations that fund and coordinate them."}, {"code": "C7", "name": "Worker-Owned Co-ops and Collectives", "n": 7, "gov": "Staff hold majority ownership and governance rights."}, {"code": "C8", "name": "Emerging Civic and Community Actors", "n": 27, "gov": "Community organizations and civic intermediaries, mostly nonprofit or informal."}, {"code": "C9", "name": "B2B and Professional Information Services", "n": 17, "gov": "Specialized information sold to institutions at enterprise price points."}]}</script>
<script>
(function(){
var D=JSON.parse(document.getElementById("nn-data").textContent),by={},total=0,g=document.getElementById("grid");
D.cohorts.forEach(function(c){by[c.code]=c;total+=c.n});
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var alt=[];
D.groups.forEach(function(gr,i){
  var s=el("section","grp"),h=el("h2","grp-h",gr.label),ul=el("ul","row"),sub=[];h.id="g"+i;s.setAttribute("aria-labelledby",h.id);
  gr.cohorts.forEach(function(k){var c=by[k],li=el("li","cell");
    li.appendChild(el("span","code",c.code));li.appendChild(el("h3","name",c.name));
    li.appendChild(el("p","n",c.n+" organizations"));li.appendChild(el("p","gov",c.gov));ul.appendChild(li);
    sub.push(c.code+" "+c.name+", "+c.n)});
  s.appendChild(h);s.appendChild(ul);g.appendChild(s);alt.push(gr.label+": "+sub.join("; "));
});
g.setAttribute("aria-label","The "+D.cohorts.length+" cohorts in "+D.groups.length+" groups, with the number of organizations in each. "+alt.join(". ")+". "+total+" organizations in all.");
document.getElementById("total").textContent=total+" organizations in "+D.cohorts.length+" cohorts";
var last=0,raf=0,qs=new URLSearchParams(location.search);
function post(){raf=0;var h=Math.ceil(document.documentElement.getBoundingClientRect().height);if(Math.abs(h-last)<2)return;last=h;parent.postMessage({type:"nn:resize",v:1,fig:"fig-2-map",height:h,nonce:qs.get("n")||""},"*")}
function req(){if(!raf)raf=requestAnimationFrame(post)}
if(parent!==window){if(window.ResizeObserver)new ResizeObserver(req).observe(document.documentElement);addEventListener("load",req);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(req);req()}
})();
</script>
