function show(html){document.open();document.write(html);document.close();}
async function dec(key){var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.i)},key,b(P.c));return new TextDecoder().decode(pt);}
async function derive(pw){var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:P.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);}
var K='atlas-preview-'+P.s.slice(0,8);
