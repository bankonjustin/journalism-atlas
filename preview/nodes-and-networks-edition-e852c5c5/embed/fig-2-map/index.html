</span></button><button type="button" class="station" data-id="C6" aria-pressed="false" style="--s:31px"><span class="st-box"><span class="st-dot"></span></span><span class="st-name">Collaboration Layers</span><span class="st-n">C6, n=8</span></button><div class="lbl">How public-minded funding becomes reporting</div></div><div class="map-line g-c" role="group" aria-label="New ways audiences and markets pay directly"><button type="button" class="station" data-id="C7" aria-pressed="false" style="--s:30px"><span class="st-box"><span class="st-dot"></span></span><span class="st-name">Worker Co-ops</span><span class="st-n">C7, n=7</span></button><button type="button" class="station" data-id="C8" aria-pressed="false" style="--s:40px"><span class="st-box"><span class="st-dot"></span></span><span class="st-name">Civic &amp; Community</span><span class="st-n">C8, n=27</span></button><button type="button" class="station" data-id="C9" aria-pressed="false" style="--s:36px"><span class="st-box"><span class="st-dot"></span></span><span class="st-name">B2B &amp; Professional</span><span class="st-n">C9, n=17</span></button><div class="lbl">New ways audiences and markets pay directly</div></div></div><div class="map-card g-a" aria-live="polite"><div class="mc-code" aria-hidden="true">C1</div><div class="mc-body"><p class="mc-name"><strong>Legacy Publishers</strong></p><p>Established publishers with institutional brand capital and legacy revenue models.</p><div class="mc-row"><span class="chip chip-solid">n=18</span><span class="chip">subscription + advertising</span></div><p class="mc-ex">Examples: New York Times · Washington Post · Fox News / Fox Corp · The Atlantic · AP Wire Service</p><p class="mc-note">Bifurcating along one fault line: whether it built a direct reader-revenue relationship before platform advertising collapsed.</p><a class="mc-go" href="#c1">Read the full C1 profile</a></div></div></div><p class="fig-cut">Nine cohorts, defined by how an organization is governed  multiple organizations.</td><td>ICIJ; URL Media; Word In Black; GroundTruth Project / Report for America; INN</td></tr><tr><th scope="row">C7 Worker Co-ops</th><td>7</td><td>subscription</td><td>Journalism organizations with worker ownership, born from institutional collapses.</td><td>Defector (Year 5); 404 Media; Hell Gate; Aftermath</td></tr><tr><th scope="row">C8 Civic &amp; Community</th><td>27</td><td>philanthropy + earned</td><td>Libraries, civic intermediaries and immigrant outlets producing journalism as a civic function.</td><td>El Tímpano; City Bureau / Documenters; Documented NYC; Outlier Media</td></tr><tr><th scope="row">C9 B2B &amp; Professional</th><td>17</td><td>B2B subscription</td><td>Journalism priced for professional buyers who expense the subscription.</td><td>Industry Dive; Politico Pro; Morning Brew (Axel Springer); The Ankler (Janice Min); Stratechery (Ben Thompson)</td></tr></tbody></table></div></details><p class="fig-note">Source: Nodes and Networks dataset, n=169.</p><p class="embed-credit">From <a href="https://journalismatlas.com/preview/nodes-and-networks-edition-e852c5c5/" target="_blank" rel="noopener">Nodes and Networks: The Reorganization of American Journalism<span class="sr"> (opens in new tab)</span></a>, Knight Center for the Future of News, ASU Cronkite School, with the Independent Journalism Atlas.</p></div></figure></main>

 network","def":"Cross-outlet networks and shared infrastructure enabling journalism across multiple organizations.","examples":["ICIJ","URL Media","Word In Black","GroundTruth Project / Report for America","INN"],"tension":"Open question: what is the survival rate of a journalism collaborative past year two?"},{"code":"C7","name":"Worker Co-ops","n":7,"model":"subscription","def":"Journalism organizations with worker ownership, born from institutional collapses.","examples":["Defector (Year 5)","404 Media","Hell Gate","Aftermath"],"tension":"3 of 7 worker co-ops in the dataset are coded as launching with a pre-built audience; the rest are mixed or not yet coded."},{"code":"C8","name":"Civic & Community","n":27,"model":"philanthropy + earned","def":"Libraries, civic intermediaries and immigrant outlets producing journalism as a civic function.","examples":["El Tímpano","City Bureau / Documenters","Documented NYC","Outlier Media"],"tension":"El Tímpano earned $350,000 in 2025 through contracts with government and nonprofit agencies."},{"code":"C9","name":"B2B & Professional","n":17,"model":"B2B subscription","def":"Journalism priced for professional buyers who expense the subscription.","examples":["Industry Dive","Politico Pro","Morning Brew (Axel Springer)","The Ankler (Janice Min)","Stratechery (Ben Thompson)"],"tension":"The reader isn't the one paying; the employer is."}]}</script>
