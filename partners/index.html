<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Pages — Independent Journalism Atlas</title>
  <meta name="description" content="Curated partner pages launching summer 2026. Collections of verified creator-journalists organized by the institutions and editors who know them best.">

  <!-- OG / Social -->
  <meta property="og:title" content="Partner Pages — Independent Journalism Atlas">
  <meta property="og:description" content="Curated partner pages launching summer 2026. Collections of verified creator-journalists organized by the institutions and editors who know them best.">
  <meta property="og:url" content="https://journalismatlas.com/partners">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://journalismatlas.com/assets/images/logos/Journalism_Atlas_wordmark_horizontal_lockup_black.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Partner Pages — Independent Journalism Atlas">
  <meta name="twitter:description" content="Curated partner pages launching summer 2026. Collections of verified creator-journalists organized by the institutions and editors who know them best.">

  <link rel="stylesheet" href="/assets/css/variables.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #fff;
      font-family: 'Hanken Grotesk', sans-serif;
    }

    .partners-holding {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
    }

    .partners-holding-inner {
      max-width: 560px;
      text-align: left;
    }

    .partners-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: rgba(255,255,255,0.3);
      margin-bottom: 20px;
    }

    .partners-headline {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: clamp(32px, 5vw, 40px);
      font-weight: 700;
      color: #fff;
      line-height: 1.15;
      margin-bottom: 20px;
    }

    .partners-body {
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.7;
      color: rgba(255,255,255,0.55);
      max-width: 480px;
      margin-bottom: 28px;
    }

    .partners-cta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #ceff00;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    .partners-cta:hover {
      opacity: 0.75;
    }
  </style>
  <link rel="stylesheet" href="/assets/css/header.css">
</head>
<body>
  <script src="/assets/js/header.js"></script>

  <section class="partners-holding">
    <div class="partners-holding-inner">
      <div class="partners-eyebrow">Coming Soon</div>
      <h1 class="partners-headline">Partner Pages</h1>
      <p class="partners-body">We're building curated partner pages — collections of verified creator-journalists organized by the institutions, researchers, and editors who know them best. Five pages launch this summer. If you're interested in partnering, reach out.</p>
      <a href="mailto:justin&#64;journalismatlas.com" class="partners-cta">Get in touch →</a>
    </div>
  </section>

</body>
</html>
