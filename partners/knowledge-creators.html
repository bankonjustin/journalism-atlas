<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Creators Picks — Independent Journalism Atlas</title>
<meta name="description" content="17 edu-journalism creators tracked by Knowledge Creators — blending journalism and education across YouTube, podcasts, and newsletters on tech, health, business, and science.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/variables.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&display=swap');
:root{--acid:#ceff00;--lime:#97d600;--olive:#5d7400;--page-bg:#efeff2;--border:#d4d4d8;--nav-height:56px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;scroll-behavior:smooth;}
body{font-family:'Hanken Grotesk',sans-serif;background:var(--page-bg);color:#313131;line-height:1.5;overflow-x:hidden;padding-top:72px;}
a{color:inherit;text-decoration:none;}img{max-width:100%;display:block;}
.container{width:100%;max-width:1040px;margin:0 auto;padding:0 40px;}
.consent-warning{position:fixed;top:var(--nav-height);left:0;right:0;z-index:999;background:#ffb700;color:#000;font-size:13px;font-weight:700;text-align:center;padding:8px 16px;}
.hero{background:#000;padding:48px 0 0;}
.hero-eyebrow{font-size:11px;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;color:var(--acid);margin-bottom:14px;}
.hero-h1{font-size:36px;font-weight:700;line-height:44px;letter-spacing:-0.5px;color:#fff;margin-bottom:12px;}
.hero-body{font-size:15px;font-weight:400;line-height:26px;color:rgba(255,255,255,0.62);max-width:600px;margin-bottom:20px;}
.curator-strip{background:#000;padding:20px 0 28px;}
.curator-strip-inner{max-width:1040px;margin:0 auto;padding:0 40px;display:flex;align-items:center;gap:16px;}
.curator-monogram{width:56px;height:56px;border-radius:50%;background:#2a2a2a;border:2px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;}
.curator-strip-text{flex:1;}
.curator-strip-name{font-size:22px;font-weight:700;color:#fff;letter-spacing:-0.2px;margin-bottom:4px;}
.curator-strip-meta{font-size:14px;font-weight:400;color:rgba(255,255,255,0.45);margin-bottom:4px;}
.curator-strip-url{font-size:13px;font-weight:400;color:rgba(255,255,255,0.35);transition:color 0.15s;}
.curator-strip-url:hover{color:var(--acid);}
.hero-collab{font-size:13px;font-weight:400;letter-spacing:0.05em;color:rgba(255,255,255,0.3);margin-top:12px;}
.filter-bar{position:sticky;top:var(--nav-height);z-index:90;background:#fff;border-bottom:0.5px solid var(--border);padding:16px 0;}
.filter-bar-inner{max-width:1040px;margin:0 auto;padding:0 40px;}
.filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.filter-row+.filter-row{margin-top:10px;}
.filter-label{font-size:11px;font-weight:400;letter-spacing:0.08em;text-transform:uppercase;color:#888;white-space:nowrap;min-width:100px;}
.chip{display:inline-flex;align-items:center;padding:5px 14px;border-radius:100px;font-size:12px;font-weight:400;background:var(--page-bg);border:0.5px solid var(--border);color:#313131;cursor:pointer;transition:background 0.12s,border-color 0.12s,color 0.12s;user-select:none;}
.chip:hover{background:#e4e4e9;border-color:#b0b0b8;}
.chip.active{background:var(--lime);border-color:var(--olive);color:#313131;}
.chip:focus-visible{outline:2px solid var(--lime);outline-offset:2px;}
.act-divider{background:#fff;height:48px;padding:0 40px;}
.act-divider-inner{width:100%;max-width:1040px;margin:0 auto;height:100%;display:flex;align-items:center;}
.act-label{font-size:11px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;color:var(--lime);white-space:nowrap;}
.act-rule{flex:1;height:1px;background:var(--border);margin:0 24px;}
.act-count-pill{display:inline-flex;align-items:center;padding:4px 12px;border-radius:100px;font-size:12px;font-weight:400;background:#fff;border:0.5px solid var(--border);color:#313131;white-space:nowrap;}
.grid-section{background:var(--page-bg);padding:48px 0 64px;}
.creator-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.creator-card{background:#fff;border:0.5px solid var(--border);border-radius:6px;padding:24px;display:flex;flex-direction:column;transition:background 0.15s,border-color 0.15s;}
.creator-card:hover{background:#efeff2;border-color:#b0b0b8;}
.creator-name{font-size:18px;font-weight:700;color:#000;line-height:1.3;margin-bottom:4px;}
.creator-channel{font-size:14px;font-weight:400;color:var(--olive);margin-bottom:6px;}
.creator-descriptor{font-size:13px;font-weight:400;font-style:italic;color:#606068;line-height:1.5;margin-bottom:10px;}
.creator-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:100px;font-size:12px;font-weight:400;background:#efeff2;border:0.5px solid var(--border);color:#313131;}
.pill.platform{background:var(--lime);border-color:var(--olive);}
.pill .material-symbols-outlined{font-size:14px;line-height:1;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 14;}
.card-divider{border:none;border-top:0.5px solid var(--border);margin-bottom:16px;}
.card-link{font-size:14px;font-weight:400;color:var(--olive);margin-top:auto;display:inline-flex;align-items:center;padding:6px 12px;border-radius:6px;margin-left:-12px;transition:color 0.15s,background 0.15s;}
.card-link:hover{color:#313131;background:var(--lime);}
.empty-state{grid-column:1/-1;padding:64px 0;text-align:center;color:#888;font-size:16px;}
.atlas-attribution{background:#fff;border:0.5px solid var(--border);border-radius:6px;padding:16px 20px;margin-top:32px;display:flex;align-items:flex-start;gap:14px;}
.atlas-attribution-badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:100px;background:#000;color:var(--acid);font-size:11px;font-weight:400;letter-spacing:0.1em;text-transform:uppercase;white-space:nowrap;flex-shrink:0;}
.atlas-attribution-body{font-size:14px;font-weight:400;color:#606068;line-height:22px;}
.atlas-attribution-body a{font-weight:400;color:var(--olive);}
.about-rule{border:none;border-top:1px solid var(--border);margin:0;}
.about-section{background:#fff;padding:80px 0;}
.about-inner{max-width:640px;}
.about-text-name{font-size:28px;font-weight:700;color:#000;letter-spacing:-0.25px;margin-bottom:24px;line-height:1.2;}
.about-headline{font-size:28px;font-weight:700;color:#000;letter-spacing:-0.25px;margin-bottom:16px;}
.about-body{font-size:16px;font-weight:400;line-height:26px;color:#444;margin-bottom:20px;}
.about-link{font-size:14px;font-weight:400;color:var(--olive);transition:color 0.15s;}
.about-link:hover{color:#000;}
.atlas-footer{background:#313131;padding:80px 0;}
.atlas-footer-inner{display:flex;flex-direction:column;align-items:flex-start;gap:20px;}
.atlas-footer-logo img{height:20px;width:auto;}
.atlas-footer-tagline{font-size:16px;font-weight:400;line-height:26px;color:rgba(255,255,255,0.65);max-width:480px;}
.atlas-footer-btn{display:inline-flex;align-items:center;padding:12px 24px;background:var(--acid);color:#000;font-family:'Hanken Grotesk',sans-serif;font-size:14px;font-weight:700;border-radius:6px;transition:opacity 0.15s;margin-top:4px;}
.atlas-footer-btn:hover{opacity:0.88;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-track{background:var(--page-bg);}::-webkit-scrollbar-thumb{background:var(--border);}
@media(max-width:768px){.hero{padding:36px 0 0;}.hero-h1{font-size:28px;line-height:36px;}.hero-body{font-size:14px;}.curator-strip{padding:16px 0 20px;}.creator-grid{grid-template-columns:1fr;}.filter-label{min-width:80px;font-size:10px;}.act-divider{padding:0 20px;}.atlas-attribution{flex-direction:column;gap:10px;}}
@media(max-width:480px){.container{padding:0 20px;}.filter-bar-inner{padding:0 20px;}.curator-strip-inner{padding:0 20px;}.hero{padding:28px 0 0;}.hero-h1{font-size:24px;line-height:32px;}.grid-section{padding:40px 0 56px;}.about-section{padding:56px 0;}.atlas-footer{padding:56px 0;}}
</style>
<link rel="stylesheet" href="/assets/css/header.css">
</head>
<body>
<script src="/assets/js/header.js"></script>
<div class="consent-warning" id="consent-warning" style="display:none;">&#9888;&#xFE0E; DRAFT — Curator consent not confirmed. Do not deploy live.</div>
<section class="hero">
  <div class="container" id="hero-content"></div>
  <div class="curator-strip"><div class="curator-strip-inner" id="curator-strip-content"></div></div>
</section>
<div id="filter-bar-mount"></div>
<div class="act-divider">
  <div class="act-divider-inner"><span class="act-label">The List</span><div class="act-rule"></div><span class="act-count-pill" id="act-count-pill"></span></div>
</div>
<section class="grid-section">
  <div class="container">
    <div class="creator-grid" id="creator-grid"></div>
    <div class="atlas-attribution" id="atlas-attribution"></div>
  </div>
</section>
<div class="about-rule"></div>
<section class="about-section"><div class="container"><div class="about-inner" id="about-inner"></div></div></section>
<footer class="atlas-footer">
  <div class="container">
    <div class="atlas-footer-inner">
      <div class="atlas-footer-logo"><img src="../assets/images/logos/Journalism_Atlas_wordmark_horizontal_lockup_white.png" alt="Independent Journalism Atlas"></div>
      <p class="atlas-footer-tagline">Curated from 1,400+ creator-journalists — powered by Journalism Atlas data.</p>
      <a href="https://journalismatlas.com" class="atlas-footer-btn">Explore the Atlas &rarr;</a>
    </div>
  </div>
</footer>

<script>
const PARTNER_CONFIG = {
  curatorName:    'Knowledge Creators',
  curatorChannel: 'Knowledge-creators.com',
  curatorUrl:     'https://knowledge-creators.com',
  curatorPhoto:   null,
  curatorNote:    'Knowledge-creators.com tracks the expanding universe of creators whose work blurs the line between journalism and education — building durable, authoritative audiences across YouTube, podcasts, and newsletters.',
  curatorQuote:   '',
  pageTitle:      'Knowledge Creators Picks — Independent Journalism Atlas',
  pageDescription:'17 edu-journalism creators tracked by Knowledge Creators — blending journalism and education across YouTube, podcasts, and newsletters on tech, health, business, and science.',
  pageUrl:        'https://journalismatlas.com/partners/knowledge-creators',
  showFilters:    true,
  logoColor:      null,
  logoWhite:      null,
  consentConfirmed: false,
  consentDate:    '',
  consentNotes:   '',
  aboutHeadline:   'About Knowledge Creators',
  aboutParagraphs: [
    'Knowledge-creators.com tracks the expanding universe of creator-journalists who blur the line between journalism and education. These are the builders of durable, authoritative audiences — people who inform, teach, and report simultaneously — working across YouTube, podcasts, and newsletters on topics from health and science to personal finance and tech.',
    'This curated list is part of an ongoing collaboration between Knowledge Creators and the Independent Journalism Atlas. Together, we are working to map and celebrate the edu-journalism ecosystem — making it easier for audiences to find creators who go deep.',
  ],
  aboutLinkText: 'Visit Knowledge Creators',
  aboutLinkUrl:  'https://knowledge-creators.com',
  creators: [
    { name: 'Codie Sanchez',        channel: 'Contrarian Thinking',   link: 'https://www.youtube.com/@CodieSanchez',       platform: 'Video - YouTube',   topic: 'Business',       descriptor: '' },
    { name: 'Dr. Jennifer Ashton',  channel: 'Dr. Jennifer Ashton',   link: 'https://www.youtube.com/@DrJenniferAshton',   platform: 'Video - YouTube',   topic: 'Health/Wellness', descriptor: '' },
    { name: 'Dr. Joel Bervell',     channel: 'Dr. Joel Bervell',      link: 'https://www.instagram.com/joelbervell',       platform: 'Video - Instagram', topic: 'Health/Wellness', descriptor: '' },
    { name: 'Dr. Shade Zahrai',     channel: 'Dr. Shade Zahrai',      link: 'https://www.youtube.com/@ShadZahrai',         platform: 'Video - YouTube',   topic: 'Health/Wellness', descriptor: '' },
    { name: 'Emma Grede',           channel: 'Emma Grede',            link: 'https://www.youtube.com/@EmmaGrede',          platform: 'Video - YouTube',   topic: 'Business',       descriptor: '' },
    { name: 'Hank Green',           channel: 'SciShow / vlogbrothers', link: 'https://www.youtube.com/@hankgreen1',        platform: 'Video - YouTube',   topic: 'Science',        descriptor: '' },
    { name: 'Jefferson Fisher',     channel: 'Jefferson Fisher',      link: 'https://www.youtube.com/@JeffersonFisher',    platform: 'Video - YouTube',   topic: 'Explanatory',    descriptor: '' },
    { name: 'Kris McDaniel',        channel: 'Kris McDaniel',         link: 'https://www.youtube.com/@KrisMcDaniel',       platform: 'Video - YouTube',   topic: 'Business',       descriptor: '' },
    { name: 'Maggie Sellers Reum',  channel: 'Maggie Sellers Reum',   link: 'https://www.instagram.com/maggiesellersreum', platform: 'Video - Instagram', topic: 'Business',       descriptor: '' },
    { name: 'Marina Mogilko',       channel: 'Silicon Valley Girl',   link: 'https://www.youtube.com/@SiliconValleyGirl',  platform: 'Video - YouTube',   topic: 'Tech',           descriptor: '' },
    { name: 'Mychal Threets',       channel: 'Mychal Threets',        link: 'https://www.instagram.com/mychalthreets',     platform: 'Video - Instagram', topic: 'Explanatory',    descriptor: '' },
    { name: 'Rowan Cheung',         channel: 'The Rundown AI',        link: 'https://www.therundown.ai',                   platform: 'Website',           topic: 'Tech',           descriptor: '' },
    { name: 'Simone Giertz',        channel: 'Simone Giertz',         link: 'https://www.youtube.com/@simonegiertz',       platform: 'Video - YouTube',   topic: 'Science',        descriptor: '' },
    { name: 'Steven Bartlett',      channel: 'Diary of a CEO',        link: 'https://www.youtube.com/@TheDiaryOfACEO',     platform: 'Podcast',           topic: 'Business',       descriptor: '' },
    { name: 'Tiffany Aliche',       channel: 'The Budgetnista',       link: 'https://www.youtube.com/@TheBudgetnista',     platform: 'Video - YouTube',   topic: 'Personal Finance', descriptor: '' },
    { name: 'Tommy Geoco',          channel: 'Tommy Geoco',           link: 'https://www.youtube.com/@tommygeoco',         platform: 'Video - YouTube',   topic: 'Explanatory',    descriptor: '' },
    { name: 'Catherine Goetze',     channel: 'Catherine Goetze',      link: 'https://www.youtube.com/@catherinegoetze',    platform: 'Video - YouTube',   topic: 'Science',        descriptor: '' },
  ],
};

function truncateToSentences(text,n){const s=text.match(/[^.!?]+[.!?]+(\s|$)/g)||[text];return s.slice(0,n).join('').trim();}
function esc(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getPlatformInfo(platform){const map={'Newsletter - Substack':{icon:'mail',name:'Substack'},'Newsletter - Beehiiv':{icon:'mail',name:'Beehiiv'},'Newsletter - Ghost':{icon:'mail',name:'Ghost'},'Newsletter - Other':{icon:'mail',name:'Newsletter'},'Video - YouTube':{icon:'play_circle',name:'YouTube'},'Video - Instagram':{icon:'play_circle',name:'Instagram'},'Video - TikTok':{icon:'play_circle',name:'TikTok'},'Podcast':{icon:'podcasts',name:'Podcast'},'Website':{icon:'language',name:'Website'}};if(map[platform])return map[platform];if(platform&&platform.startsWith('Social'))return{icon:'alternate_email',name:platform.replace('Social - ','')};return{icon:'language',name:platform||''};}
function getMonogramInitials(name){const parts=name.trim().split(/\s+/);if(parts.length>=2)return(parts[0][0]+parts[parts.length-1][0]).toUpperCase();return parts[0][0].toUpperCase();}
function renderConsentBanner(){if(!PARTNER_CONFIG.consentConfirmed)document.getElementById('consent-warning').style.display='';}
function renderHero(){
  const{curatorName,curatorNote,curatorQuote,curatorChannel,curatorUrl,curatorPhoto}=PARTNER_CONFIG;
  const pullQuoteHTML=curatorQuote?`<div class="pull-quote"><span class="pull-quote-mark">&ldquo;</span><p class="pull-quote-text">${esc(curatorQuote)}</p></div>`:'';
  document.getElementById('hero-content').innerHTML=`<p class="hero-eyebrow">A Curated List</p><h1 class="hero-h1">${esc(PARTNER_CONFIG.pageTitle.replace(' — Independent Journalism Atlas',''))}</h1><p class="hero-body">${esc(truncateToSentences(curatorNote,2))}</p>${pullQuoteHTML}`;
  const photoHTML=curatorPhoto?`<div class="curator-photo-wrap"><img class="curator-photo" src="${esc(curatorPhoto)}" alt="${esc(curatorName)}"></div>`:`<div class="curator-monogram">${esc(getMonogramInitials(curatorName))}</div>`;
  document.getElementById('curator-strip-content').innerHTML=`${photoHTML}<div class="curator-strip-text"><p class="curator-strip-name">${esc(curatorName)}</p><p class="curator-strip-meta">${esc(curatorChannel)}</p><a href="${esc(curatorUrl)}" target="_blank" rel="noopener" class="curator-strip-url">${esc(curatorUrl.replace('https://',''))}</a><p class="hero-collab">Curated by ${esc(curatorName)} &times; Independent Journalism Atlas</p></div>`;
}
function renderFilterBar(){
  const{creators}=PARTNER_CONFIG;
  const topics=[...new Set(creators.map(c=>c.topic))].sort();
  const platforms=[...new Set(creators.map(c=>c.platform))].sort();
  function chipsHTML(values,dimension){return`<button class="chip active" data-dimension="${esc(dimension)}" data-value="">All</button>`+values.map(v=>`<button class="chip" data-dimension="${esc(dimension)}" data-value="${esc(v)}">${esc(v)}</button>`).join('');}
  const el=document.createElement('div');el.className='filter-bar';
  el.innerHTML=`<div class="filter-bar-inner"><div class="filter-row"><span class="filter-label">By topic</span>${chipsHTML(topics,'topic')}</div><div class="filter-row"><span class="filter-label">By platform</span>${chipsHTML(platforms,'platform')}</div></div>`;
  document.getElementById('filter-bar-mount').appendChild(el);
}
function renderGrid(){
  document.getElementById('act-count-pill').textContent=`${PARTNER_CONFIG.creators.length} creators`;
  document.getElementById('creator-grid').innerHTML=PARTNER_CONFIG.creators.map(c=>{
    const{icon,name:platformName}=getPlatformInfo(c.platform);
    const topicHTML=c.topic?`<span class="pill">${esc(c.topic)}</span>`:'';
    const descriptorHTML=c.descriptor?`<p class="creator-descriptor">${esc(c.descriptor)}</p>`:'';
    return `<div class="creator-card" data-topic="${esc(c.topic)}" data-platform="${esc(c.platform)}"><div class="creator-name">${esc(c.name)}</div><div class="creator-channel">${esc(c.channel)}</div>${descriptorHTML}<div class="creator-pills">${topicHTML}<span class="pill platform"><span class="material-symbols-outlined">${icon}</span>${esc(platformName)}</span></div><hr class="card-divider"><a href="${esc(c.link)}" target="_blank" rel="noopener" class="card-link">Visit &rarr;</a></div>`;
  }).join('');
  document.getElementById('atlas-attribution').innerHTML=`<span class="atlas-attribution-badge">Atlas Verified</span><p class="atlas-attribution-body">Creators on this list are independently verified by the <a href="https://journalismatlas.com" target="_blank" rel="noopener">Independent Journalism Atlas</a> &mdash; a human-curated database of 1,400+ creator-journalists. <a href="https://journalismatlas.com/about-this-project" target="_blank" rel="noopener">How we verify &rarr;</a></p>`;
}
function renderAbout(){
  const{curatorName,logoColor,aboutHeadline,aboutParagraphs,aboutLinkText,aboutLinkUrl}=PARTNER_CONFIG;
  const logoHTML=logoColor?`<div class="about-logo"><img src="${esc(logoColor)}" alt="${esc(curatorName)}"></div>`:`<p class="about-text-name">${esc(curatorName)}</p>`;
  document.getElementById('about-inner').innerHTML=`${logoHTML}<h2 class="about-headline">${esc(aboutHeadline)}</h2>${aboutParagraphs.map(p=>`<p class="about-body">${esc(p)}</p>`).join('')}<a href="${esc(aboutLinkUrl)}" target="_blank" rel="noopener" class="about-link">${esc(aboutLinkText)} &nearr;</a>`;
}
function initFilters(){
  const cards=Array.from(document.querySelectorAll('.creator-card'));
  const countEl=document.getElementById('act-count-pill');
  const total=cards.length;
  let activeTopic=null,activePlatform=null;
  function applyFilters(){
    let visible=0;
    cards.forEach(card=>{const show=(!activeTopic||card.dataset.topic===activeTopic)&&(!activePlatform||card.dataset.platform===activePlatform);card.style.display=show?'':'none';if(show)visible++;});
    countEl.textContent=`${visible} of ${total} creators`;
    const emptyEl=document.getElementById('empty-state');
    if(visible===0){if(!emptyEl){const el=document.createElement('p');el.id='empty-state';el.className='empty-state';el.textContent='No creators match these filters.';document.getElementById('creator-grid').appendChild(el);}}else if(emptyEl){emptyEl.remove();}
  }
  function updateChipState(dimension,value){document.querySelectorAll(`.chip[data-dimension="${dimension}"]`).forEach(chip=>chip.classList.toggle('active',chip.dataset.value===value));}
  document.getElementById('filter-bar-mount').addEventListener('click',e=>{
    const chip=e.target.closest('.chip');if(!chip)return;
    const{dimension,value}=chip.dataset;
    if(dimension==='topic'){activeTopic=(activeTopic===value||value==='')?null:value;updateChipState('topic',activeTopic??'');}
    else if(dimension==='platform'){activePlatform=(activePlatform===value||value==='')?null:value;updateChipState('platform',activePlatform??'');}
    applyFilters();
  });
  applyFilters();
}
document.addEventListener('DOMContentLoaded',()=>{
  document.title=PARTNER_CONFIG.pageTitle;
  document.querySelector('meta[name="description"]').setAttribute('content',PARTNER_CONFIG.pageDescription);
  renderConsentBanner();renderHero();
  if(PARTNER_CONFIG.showFilters)renderFilterBar();
  renderGrid();renderAbout();
  if(PARTNER_CONFIG.showFilters)initFilters();
});
</script>
</body>
</html>
