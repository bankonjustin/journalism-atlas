:root {

body {

.hero { background: #000; padding: 48px 0 0; }

.hero-body { font-size: 15px; font-weight: 400; line-height: 26px; color: rgba(255,255,255,0.62); max-width: 600px; margin-bottom: 20px; }

.pull-quote-text { font-size: 17px; font-weight: 400; line-height: 1.5; color: rgba(255,255,255,0.85); letter-spacing: -0.1px; }

.filter-bar { position: sticky; top: var(--nav-height); z-index: 90; background: #fff; border-bottom: 0.5px solid var(--border); padding: 16px 0; }

.filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.filter-label { font-size: 11px; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; color: #888; white-space: nowrap; min-width: 100px; }
.chip { display: inline-flex; align-items: center; padding: 5px 14px; border-radius: 100px; font-size: 12px; font-weight: 400; background: var(--page-bg); border: 0.5px solid var(--border); color: #313131; cursor: pointer; transition: background 0.12s, border-color 0.12s, color 0.12s; user-select: none; }

.act-divider { background: #fff; height: 48px; padding: 0 40px; }

function truncateToSentences(text, n) {
  const sentences = text.match(/[^.!?]+[.!?]+(\s|$)/g) || [text];
  return sentences.slice(0, n).join('').trim();
}

function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function getPlatformInfo(platform) {
  const map = {
    'Newsletter - Substack': { icon: 'mail',        name: 'Substack'   },
    'Newsletter - Beehiiv':  { icon: 'mail',        name: 'Beehiiv'    },
    'Newsletter - Ghost':    { icon: 'mail',        name: 'Ghost'      },
    'Newsletter - Other':    { icon: 'mail',        name: 'Newsletter' },
    'Video - YouTube':       { icon: 'play_circle', name: 'YouTube'    },
    'Video - Instagram':     { icon: 'play_circle', name: 'Instagram'  },
    'Video - TikTok':        { icon: 'play_circle', name: 'TikTok'     },
    'Podcast':               { icon: 'podcasts',    name: 'Podcast'    },
    'Website':               { icon: 'language',    name: 'Website'    },
  };
  if (map[platform]) return map[platform];
  if (platform && platform.startsWith('Social')) return { icon: 'alternate_email', name: platform.replace('Social - ', '') };
  return { icon: 'language', name: platform || '' };
}

function getMonogramInitials(name) {
  const parts = name.trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  return parts[0][0].toUpperCase();
}

    : curatorPhoto
      ? `<div class="curator-photo-wrap"><img class="curator-photo" src="${esc(curatorPhoto)}" alt="${esc(curatorName)}"></div>`
      : `<div class="curator-monogram">${esc(getMonogramInitials(curatorName))}</div>`;
  document.getElementById('curator-strip-content').innerHTML = `
    ${photoHTML}
    <div class="curator-strip-text">
      <p class="curator-strip-name">${esc(curatorName)}</p>
      <p class="curator-strip-meta">${esc(curatorChannel)}</p>
      <a href="${esc(curatorUrl)}" target="_blank" rel="noopener" class="curator-strip-url">${esc(curatorUrl.replace('https://', ''))}</a>
      <p class="hero-collab">Curated by ${esc(curatorName)} &times; Independent Journalism Atlas</p>
    </div>
  `;
}

function renderFilterBar() {
  const { creators } = PARTNER_CONFIG;
  const topics    = [...new Set(creators.map(c => c.topic))].sort();
  const platforms = [...new Set(creators.map(c => c.platform))].sort();

  function chipsHTML(values, dimension) {
    const allChip = `<button class="chip active" data-dimension="${esc(dimension)}" data-value="">All</button>`;
    const rest = values.map(v =>
      `<button class="chip" data-dimension="${esc(dimension)}" data-value="${esc(v)}">${esc(v)}</button>`
    ).join('');
    return allChip + rest;
  }

  const el = document.createElement('div');
  el.className = 'filter-bar';
  el.innerHTML = `
    <div class="filter-bar-inner">
      <div class="filter-row">
        <span class="filter-label">By topic</span>
        ${chipsHTML(topics, 'topic')}
      </div>
      <div class="filter-row">
        <span class="filter-label">By platform</span>
        ${chipsHTML(platforms, 'platform')}
      </div>
    </div>
  `;
  document.getElementById('filter-bar-mount').appendChild(el);
}

function renderGrid() {
  document.getElementById('act-count-pill').textContent = `${PARTNER_CONFIG.creators.length} creators`;
  document.getElementById('creator-grid').innerHTML = PARTNER_CONFIG.creators.map(c => {
    const { icon, name: platformName } = getPlatformInfo(c.platform);
    const geoHTML        = c.geography  ? `<span class="pill">${esc(c.geography)}</span>`  : '';
    const topicHTML      = c.topic      ? `<span class="pill">${esc(c.topic)}</span>`      : '';
    const descriptorHTML = c.descriptor ? `<p class="creator-descriptor">${esc(c.descriptor)}</p>` : '';
    return `
      <div class="creator-card" data-topic="${esc(c.topic)}" data-platform="${esc(c.platform)}">
        <div class="creator-name">${esc(c.name)}</div>
        <div class="creator-channel">${esc(c.channel)}</div>
        ${descriptorHTML}
        <div class="creator-pills">
          ${geoHTML}
          ${topicHTML}
          <span class="pill platform">
            <span class="material-symbols-outlined">${icon}</span>${esc(platformName)}
          </span>
        </div>
        <hr class="card-divider">
        <a href="${esc(c.link)}" target="_blank" rel="noopener" class="card-link">Visit &rarr;</a>
      </div>
    `;
  }).join('');
  document.getElementById('atlas-attribution').innerHTML = `
    <span class="atlas-attribution-badge">Atlas Verified</span>
    <p class="atlas-attribution-body">
      Creators on this list are independently verified by the
      <a href="https://journalismatlas.com" target="_blank" rel="noopener">Independent Journalism Atlas</a> &mdash;
      a human-curated database of 1,400+ creator-journalists.
      <a href="https://journalismatlas.com/about-this-project" target="_blank" rel="noopener">How we verify &rarr;</a>
    </p>
  `;
}

function renderAbout() {
  const { curatorName, logoColor, aboutHeadline, aboutParagraphs, aboutLinkText, aboutLinkUrl } = PARTNER_CONFIG;
  const logoHTML  = logoColor
    ? `<div class="about-logo"><img src="${esc(logoColor)}" alt="${esc(curatorName)}"></div>`
    : `<p class="about-text-name">${esc(curatorName)}</p>`;
  const parasHTML = aboutParagraphs.map(p => `<p class="about-body">${esc(p)}</p>`).join('');
  document.getElementById('about-inner').innerHTML = `
    ${logoHTML}
    <h2 class="about-headline">${esc(aboutHeadline)}</h2>
    ${parasHTML}
    <a href="${esc(aboutLinkUrl)}" target="_blank" rel="noopener" class="about-link">${esc(aboutLinkText)} &nearr;</a>
  `;
}

function initFilters() {
  const cards   = Array.from(document.querySelectorAll('.creator-card'));
  const countEl = document.getElementById('act-count-pill');
  const total   = cards.length;
  let activeTopic    = null;
  let activePlatform = null;

  function applyFilters() {
    let visible = 0;
    cards.forEach(card => {
      const topicMatch    = !activeTopic    || card.dataset.topic    === activeTopic;
      const platformMatch = !activePlatform || card.dataset.platform === activePlatform;
      const show = topicMatch && platformMatch;
      card.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    countEl.textContent = `${visible} of ${total} creators`;
    const emptyEl = document.getElementById('empty-state');
    if (visible === 0) {
      if (!emptyEl) {
        const el = document.createElement('p');
        el.id = 'empty-state'; el.className = 'empty-state';
        el.textContent = 'No creators match these filters.';
        document.getElementById('creator-grid').appendChild(el);
      }
    } else if (emptyEl) { emptyEl.remove(); }
  }

  function updateChipState(dimension, value) {
    document.querySelectorAll(`.chip[data-dimension="${dimension}"]`).forEach(chip => {
      chip.classList.toggle('active', chip.dataset.value === value);
    });
  }

  document.getElementById('filter-bar-mount').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const { dimension, value } = chip.dataset;
    if (dimension === 'topic') {
      activeTopic = (activeTopic === value || value === '') ? null : value;
      updateChipState('topic', activeTopic ?? '');
    } else if (dimension === 'platform') {
      activePlatform = (activePlatform === value || value === '') ? null : value;
      updateChipState('platform', activePlatform ?? '');
    }
    applyFilters();
  });

  applyFilters();
}

document.addEventListener('DOMContentLoaded', () => {
  document.title = PARTNER_CONFIG.pageTitle;
  document.querySelector('meta[name="description"]').setAttribute('content', PARTNER_CONFIG.pageDescription);
  renderConsentBanner();
  renderHero();
  if (PARTNER_CONFIG.showFilters) renderFilterBar();
  renderGrid();
  renderAbout();
  if (PARTNER_CONFIG.showFilters) initFilters();
});
</script>
</body>
</html>
