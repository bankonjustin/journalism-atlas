<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anne Helen Petersen's Picks — Independent Journalism Atlas</title>
<meta name="description" content="17 independent creators recommended by Anne Helen Petersen, author of Culture Study — spanning culture, gender, local news, food, and lifestyle.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/variables.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&display=swap');

:root {
  --acid:    #ceff00;
  --lime:    #97d600;
  --olive:   #5d7400;
  --page-bg: #efeff2;
  --border:  #d4d4d8;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: 'Hanken Grotesk', sans-serif;
  background: var(--page-bg);
  color: #313131;
  line-height: 1.5;
  overflow-x: hidden;
  padding-top: 72px;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

.container { width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 40px; }

/* ── ACT ONE — HERO, black ── */
.hero { background: #000; padding: 88px 0 0; }
.hero-eyebrow { font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--acid); margin-bottom: 20px; }
.hero-h1 { font-size: 44px; font-weight: 700; line-height: 52px; letter-spacing: -0.5px; color: #fff; margin-bottom: 20px; }
.hero-body { font-size: 17px; font-weight: 400; line-height: 28px; color: rgba(255,255,255,0.72); max-width: 640px; margin-bottom: 48px; }

/* Pull-quote block */
.pull-quote { max-width: 640px; margin-bottom: 64px; }
.pull-quote-mark {
  font-size: 80px; font-weight: 700; line-height: 0.7;
  color: var(--acid); margin-bottom: 16px; display: block;
  font-family: Georgia, serif;
}
.pull-quote-text { font-size: 28px; font-weight: 700; line-height: 1.3; color: #fff; letter-spacing: -0.25px; }

/* Curator identity strip */
.curator-strip {
  background: #000;
  border-top: 0.5px solid rgba(255,255,255,0.12);
  padding: 32px 0;
  margin-top: 8px;
}
.curator-strip-inner { max-width: 1040px; margin: 0 auto; padding: 0 40px; }
.curator-strip-name { font-size: 28px; font-weight: 700; color: #fff; letter-spacing: -0.25px; margin-bottom: 6px; }
.curator-strip-meta { font-size: 14px; font-weight: 400; color: rgba(255,255,255,0.45); margin-bottom: 4px; }
.curator-strip-url { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.35); transition: color 0.15s; }
.curator-strip-url:hover { color: var(--acid); }
.hero-collab { font-size: 13px; font-weight: 500; letter-spacing: 0.05em; color: rgba(255,255,255,0.3); margin-top: 16px; }

/* ── ACT TRANSITION DIVIDER ── */
.act-divider {
  background: #fff;
  height: 48px;
  display: flex; align-items: center;
  padding: 0 40px;
  max-width: 100%;
  gap: 0;
}
.act-divider-inner {
  width: 100%; max-width: 1040px; margin: 0 auto;
  display: flex; align-items: center; gap: 0;
}
.act-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
  text-transform: uppercase; color: var(--lime); white-space: nowrap;
}
.act-rule { flex: 1; height: 1px; background: var(--border); margin: 0 24px; }
.act-count-pill {
  display: inline-flex; align-items: center;
  padding: 4px 12px; border-radius: 100px;
  font-size: 12px; font-weight: 500;
  background: #fff; border: 0.5px solid var(--border); color: #313131;
  white-space: nowrap;
}

/* ── ACT TWO — GRID SECTION ── */
.grid-section { background: var(--page-bg); padding: 48px 0 64px; }
.creator-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }

/* ── CREATOR CARD ── */
.creator-card {
  background: #fff;
  border: 0.5px solid var(--border);
  border-radius: 6px;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  transition: background 0.15s, border-color 0.15s;
}
.creator-card:hover { background: #efeff2; border-color: #b0b0b8; }
.creator-name { font-size: 18px; font-weight: 700; color: #000; line-height: 1.3; margin-bottom: 4px; }
.creator-channel { font-size: 14px; font-weight: 500; color: var(--olive); margin-bottom: 12px; }
.creator-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 12px; border-radius: 100px;
  font-size: 12px; font-weight: 500;
  background: #efeff2; border: 0.5px solid var(--border); color: #313131;
}
.pill.platform { background: var(--lime); border-color: var(--olive); }
.pill .material-symbols-outlined {
  font-size: 14px; line-height: 1;
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 14;
}
.card-divider { border: none; border-top: 0.5px solid var(--border); margin-bottom: 14px; }
.card-link {
  font-size: 14px; font-weight: 500; color: var(--olive);
  margin-top: auto;
  display: inline-flex; align-items: center;
  padding: 6px 12px; border-radius: 6px; margin-left: -12px;
  transition: color 0.15s, background 0.15s;
}
.card-link:hover { color: #313131; background: var(--lime); }
.card-link:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

/* Compact Atlas note */
.atlas-note {
  max-width: 640px;
  padding-top: 32px;
  font-size: 14px; font-weight: 400; line-height: 22px; color: #606068;
}
.atlas-note a { font-weight: 500; color: var(--olive); }
.atlas-note a:hover { color: #000; }

/* ── ABOUT SECTION — white ── */
.about-rule { border: none; border-top: 1px solid var(--border); margin: 0; }
.about-section { background: #fff; padding: 80px 0; }
.about-inner { max-width: 640px; }
.about-text-name { font-size: 28px; font-weight: 700; color: #000; letter-spacing: -0.25px; margin-bottom: 24px; line-height: 1.2; }
.about-headline { font-size: 28px; font-weight: 700; color: #000; letter-spacing: -0.25px; margin-bottom: 16px; }
.about-body { font-size: 16px; font-weight: 400; line-height: 26px; color: #444; margin-bottom: 20px; }
.about-link { font-size: 14px; font-weight: 500; color: var(--olive); transition: color 0.15s; }
.about-link:hover { color: #000; }

/* ── ATLAS FOOTER — dark gray ── */
.atlas-footer { background: #313131; padding: 80px 0; }
.atlas-footer-inner { display: flex; flex-direction: column; align-items: flex-start; gap: 20px; }
.atlas-footer-logo img { height: 20px; width: auto; }
.atlas-footer-tagline { font-size: 16px; font-weight: 400; line-height: 26px; color: rgba(255,255,255,0.65); max-width: 480px; }
.atlas-footer-btn {
  display: inline-flex; align-items: center;
  padding: 12px 24px;
  background: var(--acid); color: #000;
  font-family: 'Hanken Grotesk', sans-serif;
  font-size: 14px; font-weight: 700; border-radius: 6px;
  transition: opacity 0.15s; margin-top: 4px;
}
.atlas-footer-btn:hover { opacity: 0.88; }
.atlas-footer-btn:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: var(--page-bg); }
::-webkit-scrollbar-thumb { background: var(--border); }

@media (max-width: 768px) {
  .hero { padding: 56px 0 0; }
  .hero-h1 { font-size: 32px; line-height: 40px; }
  .hero-body { font-size: 16px; margin-bottom: 32px; }
  .pull-quote-text { font-size: 22px; }
  .pull-quote { margin-bottom: 40px; }
  .act-divider { padding: 0 20px; }
}

@media (max-width: 480px) {
  .container { padding: 0 20px; }
  .curator-strip-inner { padding: 0 20px; }
  .hero { padding: 48px 0 0; }
  .hero-h1 { font-size: 26px; line-height: 34px; }
  .pull-quote-text { font-size: 20px; }
  .pull-quote-mark { font-size: 64px; }
  .grid-section { padding: 40px 0 56px; }
  .about-section { padding: 56px 0; }
  .atlas-footer { padding: 56px 0; }
}
</style>
<link rel="stylesheet" href="/assets/css/header.css">
</head>
<body>
<script src="/assets/js/header.js"></script>

<!-- ACT ONE: HERO -->
<section class="hero">
  <div class="container" id="hero-content"></div>
  <div class="curator-strip">
    <div class="curator-strip-inner" id="curator-strip-content"></div>
  </div>
</section>

<!-- ACT TRANSITION DIVIDER -->
<div class="act-divider">
  <div class="act-divider-inner">
    <span class="act-label">The List</span>
    <div class="act-rule"></div>
    <span class="act-count-pill" id="act-count-pill"></span>
  </div>
</div>

<!-- ACT TWO: GRID -->
<section class="grid-section">
  <div class="container">
    <div class="creator-grid" id="creator-grid"></div>
    <p class="atlas-note" id="atlas-note"></p>
  </div>
</section>

<!-- ABOUT -->
<div class="about-rule"></div>
<section class="about-section">
  <div class="container">
    <div class="about-inner" id="about-inner"></div>
  </div>
</section>

<!-- ATLAS FOOTER -->
<footer class="atlas-footer">
  <div class="container">
    <div class="atlas-footer-inner">
      <div class="atlas-footer-logo">
        <img src="../assets/images/logos/Journalism_Atlas_wordmark_horizontal_lockup_white.png" alt="Independent Journalism Atlas">
      </div>
      <p class="atlas-footer-tagline">Discover 1,200+ independent creator-journalists across newsletters, video, podcasts, and social.</p>
      <a href="https://journalismatlas.com" class="atlas-footer-btn">Explore the Atlas &rarr;</a>
    </div>
  </div>
</footer>

<script>
const PARTNER_CONFIG = {
  curatorName:    'Anne Helen Petersen',
  curatorChannel: 'Culture Study',
  curatorUrl:     'https://annehelen.substack.com',
  curatorNote:    'Anne Helen Petersen is a culture critic whose Substack newsletter Culture Study reaches hundreds of thousands of readers weekly. This list is the independent creator layer she returns to when she wants to understand what is actually happening in American life — not in Washington, but in the culture. These are writers working outside major institutional platforms, building direct relationships with readers. They cover the politics of everyday life: celebrity, labor, technology, the textures of American class.',
  curatorQuote:   'These are the writers I return to when I want to understand what is actually happening — not in Washington, but in the culture.',
  pageTitle:      "Anne Helen Petersen's Picks — Independent Journalism Atlas",
  pageDescription:'17 independent creators recommended by Anne Helen Petersen, author of Culture Study — spanning culture, gender, local news, food, and lifestyle.',
  pageUrl:        'https://journalismatlas.com/partners/ahp',
  logoColor:      null,
  aboutHeadline:  'About Anne Helen Petersen',
  aboutParagraphs: [
    'Anne Helen Petersen is the author of Culture Study, one of the most widely-read independent newsletters on culture, gender, work, and politics. A former BuzzFeed News culture critic, she brings a rigorous, deeply reported sensibility to the independent creator space — and has become one of the most trusted curators in the Substack ecosystem.',
  ],
  aboutLinkText: 'Read Culture Study',
  aboutLinkUrl:  'https://annehelen.substack.com',

  creators: [
    { name: 'Alissa Walker',      channel: 'Alissa Walker',                       link: 'https://alissawalker.substack.com',        platform: 'Newsletter - Substack', topic: 'Culture'          },
    { name: 'Anna Brones',        channel: 'Anna Brones',                         link: 'https://annabrones.substack.com',           platform: 'Newsletter - Substack', topic: 'Lifestyle'        },
    { name: 'Garrett Bucks',      channel: 'The White Pages',                     link: 'https://garrettbucks.substack.com',         platform: 'Newsletter - Substack', topic: 'Activism'         },
    { name: 'Kate Manne',         channel: 'Kate Manne',                          link: 'https://katemanne.substack.com',            platform: 'Newsletter - Substack', topic: 'Gender'           },
    { name: 'Virginia Sole-Smith',channel: 'Burnt Toast',                         link: 'https://virginiasolesmith.substack.com',    platform: 'Newsletter - Substack', topic: 'Food'             },
    { name: 'Lyz Lenz',           channel: 'Men Yell At Me',                      link: 'https://lyzlenz.substack.com',              platform: 'Newsletter - Substack', topic: 'Gender'           },
    { name: 'Chris La Tray',      channel: 'An Irritable Metis',                  link: 'https://chrislatray.substack.com',          platform: 'Newsletter - Substack', topic: 'Culture'          },
    { name: 'Hetty Lui McKinnon', channel: 'Hetty Lui McKinnon',                  link: 'https://hettymckinnon.substack.com',        platform: 'Newsletter - Substack', topic: 'Food'             },
    { name: 'Sara Petersen',      channel: 'In Pursuit of Clean Countertops',     link: 'https://sarapetersen.substack.com',         platform: 'Newsletter - Substack', topic: 'Parenting'        },
    { name: 'Joanna Goddard',     channel: 'Cup of Jo',                           link: 'https://cupofjo.com',                       platform: 'Website',               topic: 'Lifestyle'        },
    { name: 'Sari Botton',        channel: 'Oldster Magazine',                    link: 'https://oldster.substack.com',              platform: 'Newsletter - Substack', topic: 'Culture'          },
    { name: 'Super Nuclear',      channel: 'Super Nuclear',                       link: 'https://supernuclear.substack.com',         platform: 'Newsletter - Substack', topic: 'Lifestyle'        },
    { name: 'Caroline Saunders',  channel: 'Caroline Saunders',                   link: 'https://carolinesaunders.substack.com',     platform: 'Newsletter - Substack', topic: 'Food'             },
    { name: 'Amanda Montei',      channel: 'Amanda Montei',                       link: 'https://amandamontei.substack.com',         platform: 'Newsletter - Substack', topic: 'Gender'           },
    { name: 'Brandon Tyler',      channel: 'Brandon Tyler',                       link: 'https://brandontyler.substack.com',         platform: 'Newsletter - Substack', topic: 'Culture'          },
    { name: 'Clara',              channel: "Hmm That's Interesting",              link: 'https://hmmthatsinteresting.substack.com',  platform: 'Newsletter - Substack', topic: 'Internet Culture' },
    { name: 'Kelton Wright',      channel: 'Kelton Wright',                       link: 'https://keltonwright.substack.com',         platform: 'Newsletter - Substack', topic: 'Lifestyle'        },
  ],
};

/* ── UTILITIES ── */
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function getPlatformInfo(platform) {
  const map = {
    'Newsletter - Substack': { icon: 'mail', name: 'Substack'   },
    'Newsletter - Beehiiv':  { icon: 'mail', name: 'Beehiiv'    },
    'Newsletter - Ghost':    { icon: 'mail', name: 'Ghost'      },
    'Newsletter - Other':    { icon: 'mail', name: 'Newsletter' },
    'Video - YouTube':       { icon: 'play_circle', name: 'YouTube'  },
    'Podcast':               { icon: 'podcasts',    name: 'Podcast'  },
    'Website':               { icon: 'language',    name: 'Website'  },
  };
  if (map[platform]) return map[platform];
  if (platform && platform.startsWith('Social')) return { icon: 'alternate_email', name: platform.replace('Social - ', '') };
  return { icon: 'language', name: platform || '' };
}

/* ── RENDER HERO ── */
function renderHero() {
  const { curatorName, curatorNote, curatorQuote } = PARTNER_CONFIG;

  document.getElementById('hero-content').innerHTML = `
    <p class="hero-eyebrow">A Curated List</p>
    <h1 class="hero-h1">Anne Helen Petersen's Picks</h1>
    <p class="hero-body">${esc(curatorNote)}</p>
    <div class="pull-quote">
      <span class="pull-quote-mark">&ldquo;</span>
      <p class="pull-quote-text">${esc(curatorQuote)}</p>
    </div>
  `;

  document.getElementById('curator-strip-content').innerHTML = `
    <p class="curator-strip-name">${esc(curatorName)}</p>
    <p class="curator-strip-meta">${esc(PARTNER_CONFIG.curatorChannel)}</p>
    <a href="${esc(PARTNER_CONFIG.curatorUrl)}" target="_blank" rel="noopener" class="curator-strip-url">${esc(PARTNER_CONFIG.curatorUrl.replace('https://', ''))}</a>
    <p class="hero-collab">Curated by ${esc(curatorName)} &times; Independent Journalism Atlas</p>
  `;
}

/* ── RENDER COUNT PILL ── */
function renderCountPill() {
  document.getElementById('act-count-pill').textContent = `${PARTNER_CONFIG.creators.length} creators`;
}

/* ── RENDER GRID ── */
function renderGrid() {
  document.getElementById('creator-grid').innerHTML = PARTNER_CONFIG.creators.map(c => {
    const { icon, name: platformName } = getPlatformInfo(c.platform);
    const geoHTML   = c.geography ? `<span class="pill">${esc(c.geography)}</span>` : '';
    const topicHTML = c.topic     ? `<span class="pill">${esc(c.topic)}</span>`     : '';
    return `
      <div class="creator-card">
        <div class="creator-name">${esc(c.name)}</div>
        <div class="creator-channel">${esc(c.channel)}</div>
        <div class="creator-pills">
          ${geoHTML}
          ${topicHTML}
          <span class="pill platform">
            <span class="material-symbols-outlined">${icon}</span>${esc(platformName)}
          </span>
        </div>
        <hr class="card-divider">
        <a href="${esc(c.link)}" target="_blank" rel="noopener" class="card-link">Visit &rarr;</a>
      </div>
    `;
  }).join('');

  document.getElementById('atlas-note').innerHTML =
    'All creators on this list are independently verified by the Independent Journalism Atlas — a human-curated database of 1,200+ creator-journalists. <a href="https://journalismatlas.com/about-this-project" target="_blank" rel="noopener">Learn about our methodology &rarr;</a>';
}

/* ── RENDER ABOUT ── */
function renderAbout() {
  const { curatorName, logoColor, aboutHeadline, aboutParagraphs, aboutLinkText, aboutLinkUrl } = PARTNER_CONFIG;
  const logoHTML  = logoColor
    ? `<div class="about-logo"><img src="${esc(logoColor)}" alt="${esc(curatorName)}"></div>`
    : `<p class="about-text-name">${esc(curatorName)}</p>`;
  const parasHTML = aboutParagraphs.map(p => `<p class="about-body">${esc(p)}</p>`).join('');
  document.getElementById('about-inner').innerHTML = `
    ${logoHTML}
    <h2 class="about-headline">${esc(aboutHeadline)}</h2>
    ${parasHTML}
    <a href="${esc(aboutLinkUrl)}" target="_blank" rel="noopener" class="about-link">${esc(aboutLinkText)} &nearr;</a>
  `;
}

/* ── INIT ── */
document.addEventListener('DOMContentLoaded', () => {
  document.title = PARTNER_CONFIG.pageTitle;
  document.querySelector('meta[name="description"]').setAttribute('content', PARTNER_CONFIG.pageDescription);
  renderHero();
  renderCountPill();
  renderGrid();
  renderAbout();
});
</script>
</body>
</html>
