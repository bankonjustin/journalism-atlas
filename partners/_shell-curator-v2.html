<style>
@import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&display=swap');

:root {
  --acid:       #ceff00;
  --lime:       #97d600;
  --olive:      #5d7400;
  --page-bg:    #efeff2;
  --border:     #d4d4d8;
  --nav-height: 56px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: 'Hanken Grotesk', sans-serif;
  background: var(--page-bg);
  color: #313131;
  line-height: 1.5;
  overflow-x: hidden;
  padding-top: 72px;
}
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

.container { width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 40px; }

/* ── CONSENT BANNER ── */
.consent-warning {
  position: fixed;
  top: var(--nav-height);
  left: 0; right: 0;
  z-index: 999;
  background: #ffb700;
  color: #000;
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  padding: 8px 16px;
}

/* ── ACT ONE: HERO — black ── */
.hero { background: #000; padding: 88px 0 0; }
.hero-eyebrow { font-size: 12px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--acid); margin-bottom: 20px; }
.hero-h1 { font-size: 44px; font-weight: 700; line-height: 52px; letter-spacing: -0.5px; color: #fff; margin-bottom: 20px; }
.hero-body { font-size: 17px; font-weight: 400; line-height: 28px; color: rgba(255,255,255,0.72); max-width: 640px; margin-bottom: 48px; }

/* Pull-quote */
.pull-quote { max-width: 640px; margin-bottom: 64px; }
.pull-quote-mark {
  font-size: 80px; font-weight: 700; line-height: 0.7;
  color: var(--acid); margin-bottom: 16px; display: block;
  font-family: Georgia, serif;
}
.pull-quote-text { font-size: 28px; font-weight: 700; line-height: 1.3; color: #fff; letter-spacing: -0.25px; }

/* Curator strip */
.curator-strip {
  background: #000;
  border-top: 0.5px solid rgba(255,255,255,0.12);
  padding: 32px 0;
}
.curator-strip-inner {
  max-width: 1040px; margin: 0 auto; padding: 0 40px;
  display: flex; align-items: center; gap: 20px;
}
.curator-photo-wrap { flex-shrink: 0; }
.curator-photo {
  width: 56px; height: 56px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.15);
  object-fit: cover; display: block;
}
.curator-monogram {
  width: 56px; height: 56px; border-radius: 50%;
  background: #2a2a2a; border: 2px solid rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: #fff; letter-spacing: 0.02em;
  flex-shrink: 0;
}
.curator-strip-text { flex: 1; }
.curator-strip-name { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.2px; margin-bottom: 4px; }
.curator-strip-meta { font-size: 14px; font-weight: 400; color: rgba(255,255,255,0.45); margin-bottom: 4px; }
.curator-strip-url { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.35); transition: color 0.15s; }
.curator-strip-url:hover { color: var(--acid); }
.hero-collab { font-size: 13px; font-weight: 500; letter-spacing: 0.05em; color: rgba(255,255,255,0.3); margin-top: 12px; }

/* ── FILTER BAR — white, sticky ── */
.filter-bar {
  position: sticky;
  top: var(--nav-height);
  z-index: 90;
  background: #fff;
  border-bottom: 0.5px solid var(--border);
  padding: 16px 0;
}
.filter-bar-inner { max-width: 1040px; margin: 0 auto; padding: 0 40px; }
.filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.filter-row + .filter-row { margin-top: 10px; }
.filter-label {
  font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
  text-transform: uppercase; color: #888; white-space: nowrap; min-width: 100px;
}
.chip {
  display: inline-flex; align-items: center;
  padding: 5px 14px; border-radius: 100px;
  font-size: 12px; font-weight: 500;
  background: var(--page-bg); border: 0.5px solid var(--border); color: #313131;
  cursor: pointer; transition: background 0.12s, border-color 0.12s, color 0.12s;
  user-select: none;
}
.chip:hover { background: #e4e4e9; border-color: #b0b0b8; }
.chip.active { background: var(--lime); border-color: var(--olive); color: #313131; }
.chip:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

/* ── ACT TRANSITION DIVIDER ── */
.act-divider {
  background: #fff;
  height: 48px;
  padding: 0 40px;
}
.act-divider-inner {
  width: 100%; max-width: 1040px; margin: 0 auto;
  height: 100%;
  display: flex; align-items: center;
}
.act-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.15em;
  text-transform: uppercase; color: var(--lime); white-space: nowrap;
}
.act-rule { flex: 1; height: 1px; background: var(--border); margin: 0 24px; }
.act-count-pill {
  display: inline-flex; align-items: center;
  padding: 4px 12px; border-radius: 100px;
  font-size: 12px; font-weight: 500;
  background: #fff; border: 0.5px solid var(--border); color: #313131;
  white-space: nowrap;
}

/* ── GRID SECTION ── */
.grid-section { background: var(--page-bg); padding: 48px 0 64px; }
.creator-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

/* ── CREATOR CARD ── */
.creator-card {
  background: #fff;
  border: 0.5px solid var(--border);
  border-radius: 6px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  transition: background 0.15s, border-color 0.15s;
}
.creator-card:hover { background: #efeff2; border-color: #b0b0b8; }
.creator-name { font-size: 18px; font-weight: 700; color: #000; line-height: 1.3; margin-bottom: 4px; }
.creator-channel { font-size: 14px; font-weight: 500; color: var(--olive); margin-bottom: 6px; }
.creator-descriptor { font-size: 13px; font-weight: 400; font-style: italic; color: #606068; line-height: 1.5; margin-bottom: 10px; }
.creator-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 12px; border-radius: 100px;
  font-size: 12px; font-weight: 500;
  background: #efeff2; border: 0.5px solid var(--border); color: #313131;
}
.pill.platform { background: var(--lime); border-color: var(--olive); }
.pill .material-symbols-outlined {
  font-size: 14px; line-height: 1;
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 14;
}
.card-divider { border: none; border-top: 0.5px solid var(--border); margin-bottom: 16px; }
.card-link {
  font-size: 14px; font-weight: 500; color: var(--olive);
  margin-top: auto;
  display: inline-flex; align-items: center;
  padding: 6px 12px; border-radius: 6px; margin-left: -12px;
  transition: color 0.15s, background 0.15s;
}
.card-link:hover { color: #313131; background: var(--lime); }
.card-link:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

/* Empty state */
.empty-state { grid-column: 1 / -1; padding: 64px 0; text-align: center; color: #888; font-size: 16px; }

/* Atlas attribution block */
.atlas-attribution {
  background: #fff;
  border: 0.5px solid var(--border);
  border-radius: 6px;
  padding: 16px 20px;
  margin-top: 32px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.atlas-attribution-badge {
  display: inline-flex; align-items: center;
  padding: 4px 10px; border-radius: 100px;
  background: #000; color: var(--acid);
  font-size: 11px; font-weight: 500; letter-spacing: 0.1em;
  text-transform: uppercase; white-space: nowrap; flex-shrink: 0;
}
.atlas-attribution-body {
  font-size: 14px; font-weight: 400; color: #606068; line-height: 22px;
}
.atlas-attribution-body a { font-weight: 500; color: var(--olive); }
.atlas-attribution-body a:hover { color: #000; }

/* ── ABOUT SECTION — white ── */
.about-rule { border: none; border-top: 1px solid var(--border); margin: 0; }
.about-section { background: #fff; padding: 80px 0; }
.about-inner { max-width: 640px; }
.about-logo { margin-bottom: 24px; }
.about-logo img { height: 44px; width: auto; }
.about-text-name { font-size: 28px; font-weight: 700; color: #000; letter-spacing: -0.25px; margin-bottom: 24px; line-height: 1.2; }
.about-headline { font-size: 28px; font-weight: 700; color: #000; letter-spacing: -0.25px; margin-bottom: 16px; }
.about-body { font-size: 16px; font-weight: 400; line-height: 26px; color: #444; margin-bottom: 20px; }
.about-link { font-size: 14px; font-weight: 500; color: var(--olive); transition: color 0.15s; }
.about-link:hover { color: #000; }

/* ── ATLAS FOOTER — dark gray ── */
.atlas-footer { background: #313131; padding: 80px 0; }
.atlas-footer-inner { display: flex; flex-direction: column; align-items: flex-start; gap: 20px; }
.atlas-footer-logo img { height: 20px; width: auto; }
.atlas-footer-tagline { font-size: 16px; font-weight: 400; line-height: 26px; color: rgba(255,255,255,0.65); max-width: 480px; }
.atlas-footer-btn {
  display: inline-flex; align-items: center;
  padding: 12px 24px;
  background: var(--acid); color: #000;
  font-family: 'Hanken Grotesk', sans-serif;
  font-size: 14px; font-weight: 700; border-radius: 6px;
  transition: opacity 0.15s; margin-top: 4px;
}
.atlas-footer-btn:hover { opacity: 0.88; }
.atlas-footer-btn:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: var(--page-bg); }
::-webkit-scrollbar-thumb { background: var(--border); }

@media (max-width: 768px) {
  .hero { padding: 56px 0 0; }
  .hero-h1 { font-size: 32px; line-height: 40px; }
  .hero-body { font-size: 16px; margin-bottom: 32px; }
  .pull-quote-text { font-size: 22px; }
  .pull-quote { margin-bottom: 40px; }
  .creator-grid { grid-template-columns: 1fr; }
  .filter-label { min-width: 80px; font-size: 10px; }
  .act-divider { padding: 0 20px; }
  .atlas-attribution { flex-direction: column; gap: 10px; }
}

@media (max-width: 480px) {
  .container { padding: 0 20px; }
  .filter-bar-inner { padding: 0 20px; }
  .curator-strip-inner { padding: 0 20px; }
  .hero { padding: 48px 0 0; }
  .hero-h1 { font-size: 26px; line-height: 34px; }
  .pull-quote-text { font-size: 20px; }
  .pull-quote-mark { font-size: 64px; }
  .grid-section { padding: 40px 0 56px; }
  .about-section { padding: 56px 0; }
  .atlas-footer { padding: 56px 0; }
}
</style>

<script>
/* =========================================================
   PARTNER CONFIG — fill all fields when cloning this shell

   consentConfirmed MUST be set to true before deploying live.
   ========================================================= */
const PARTNER_CONFIG = {

  // ── IDENTITY ──
  curatorName:    'Anne Helen Petersen',
  curatorChannel: 'Culture Study',
  curatorUrl:     'https://annehelen.substack.com',

  // ── HERO COPY ──

  aboutHeadline:   'About Anne Helen Petersen',
  aboutParagraphs: [

  ],
  aboutLinkText: 'Read Culture Study',
  aboutLinkUrl:  'https://annehelen.substack.com',

  // ── CREATOR DATA ──
  creators: [
    { name: 'Alissa Walker',       channel: 'Alissa Walker',                      link: 'https://alissawalker.substack.com',       platform: 'Newsletter - Substack', topic: 'Culture',          descriptor: '' },
    { name: 'Anna Brones',         channel: 'Anna Brones',                        link: 'https://annabrones.substack.com',          platform: 'Newsletter - Substack', topic: 'Lifestyle',        descriptor: '' },
    { name: 'Garrett Bucks',       channel: 'The White Pages',                    link: 'https://garrettbucks.substack.com',        platform: 'Newsletter - Substack', topic: 'Activism',         descriptor: '' },
    { name: 'Kate Manne',          channel: 'Kate Manne',                         link: 'https://katemanne.substack.com',           platform: 'Newsletter - Substack', topic: 'Gender',           descriptor: '' },
    { name: 'Virginia Sole-Smith', channel: 'Burnt Toast',                        link: 'https://virginiasolesmith.substack.com',   platform: 'Newsletter - Substack', topic: 'Food',             descriptor: '' },
    { name: 'Lyz Lenz',            channel: 'Men Yell At Me',                     link: 'https://lyzlenz.substack.com',             platform: 'Newsletter - Substack', topic: 'Gender',           descriptor: '' },
    { name: 'Chris La Tray',       channel: 'An Irritable Metis',                 link: 'https://chrislatray.substack.com',         platform: 'Newsletter - Substack', topic: 'Culture',          descriptor: '' },
    { name: 'Hetty Lui McKinnon',  channel: 'Hetty Lui McKinnon',                 link: 'https://hettymckinnon.substack.com',       platform: 'Newsletter - Substack', topic: 'Food',             descriptor: '' },
    { name: 'Sara Petersen',       channel: 'In Pursuit of Clean Countertops',    link: 'https://sarapetersen.substack.com',        platform: 'Newsletter - Substack', topic: 'Parenting',        descriptor: '' },
    { name: 'Joanna Goddard',      channel: 'Cup of Jo',                          link: 'https://cupofjo.com',                      platform: 'Website',               topic: 'Lifestyle',        descriptor: '' },
    { name: 'Sari Botton',         channel: 'Oldster Magazine',                   link: 'https://oldster.substack.com',             platform: 'Newsletter - Substack', topic: 'Culture',          descriptor: '' },
    { name: 'Super Nuclear',       channel: 'Super Nuclear',                      link: 'https://supernuclear.substack.com',        platform: 'Newsletter - Substack', topic: 'Lifestyle',        descriptor: '' },
    { name: 'Caroline Saunders',   channel: 'Caroline Saunders',                  link: 'https://carolinesaunders.substack.com',    platform: 'Newsletter - Substack', topic: 'Food',             descriptor: '' },
    { name: 'Amanda Montei',       channel: 'Amanda Montei',                      link: 'https://amandamontei.substack.com',        platform: 'Newsletter - Substack', topic: 'Gender',           descriptor: '' },
    { name: 'Brandon Tyler',       channel: 'Brandon Tyler',                      link: 'https://brandontyler.substack.com',        platform: 'Newsletter - Substack', topic: 'Culture',          descriptor: '' },
    { name: 'Clara',               channel: "Hmm That's Interesting",             link: 'https://hmmthatsinteresting.substack.com', platform: 'Newsletter - Substack', topic: 'Internet Culture', descriptor: '' },
    { name: 'Kelton Wright',       channel: 'Kelton Wright',                      link: 'https://keltonwright.substack.com',        platform: 'Newsletter - Substack', topic: 'Lifestyle',        descriptor: '' },
  ],
};

/* ── UTILITIES ── */
function esc(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function getPlatformInfo(platform) {
  const map = {
    'Newsletter - Substack': { icon: 'mail',             name: 'Substack'   },
    'Newsletter - Beehiiv':  { icon: 'mail',             name: 'Beehiiv'    },
    'Newsletter - Ghost':    { icon: 'mail',             name: 'Ghost'      },
    'Newsletter - Other':    { icon: 'mail',             name: 'Newsletter' },
    'Video - YouTube':       { icon: 'play_circle',      name: 'YouTube'    },
    'Video - Instagram':     { icon: 'play_circle',      name: 'Instagram'  },
    'Video - TikTok':        { icon: 'play_circle',      name: 'TikTok'     },
    'Podcast':               { icon: 'podcasts',         name: 'Podcast'    },
    'Website':               { icon: 'language',         name: 'Website'    },
  };
  if (map[platform]) return map[platform];
  if (platform && platform.startsWith('Social')) return { icon: 'alternate_email', name: platform.replace('Social - ', '') };
  return { icon: 'language', name: platform || '' };
}

function getMonogramInitials(name) {
  const parts = name.trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  return parts[0][0].toUpperCase();
}

/* ── RENDER CONSENT BANNER ── */
function renderConsentBanner() {
  if (!PARTNER_CONFIG.consentConfirmed) {
    document.getElementById('consent-warning').style.display = '';
    document.body.style.paddingTop = '72px'; // banner adds 8px+padding but nav already accounts for most
  }
}

/* ── RENDER HERO ── */
function renderHero() {
  const { curatorName, curatorNote, curatorQuote, curatorChannel, curatorUrl, curatorPhoto } = PARTNER_CONFIG;

  document.getElementById('hero-content').innerHTML = `
    <p class="hero-eyebrow">A Curated List</p>
    <h1 class="hero-h1">${esc(PARTNER_CONFIG.pageTitle.replace(' — Independent Journalism Atlas', ''))}</h1>
    <p class="hero-body">${esc(curatorNote)}</p>
    <div class="pull-quote">
      <span class="pull-quote-mark">&ldquo;</span>
      <p class="pull-quote-text">${esc(curatorQuote)}</p>
    </div>
  `;

  const photoHTML = curatorPhoto
    ? `<div class="curator-photo-wrap"><img class="curator-photo" src="${esc(curatorPhoto)}" alt="${esc(curatorName)}"></div>`
    : `<div class="curator-monogram">${esc(getMonogramInitials(curatorName))}</div>`;

  document.getElementById('curator-strip-content').innerHTML = `
    ${photoHTML}
    <div class="curator-strip-text">
      <p class="curator-strip-name">${esc(curatorName)}</p>
      <p class="curator-strip-meta">${esc(curatorChannel)}</p>
      <a href="${esc(curatorUrl)}" target="_blank" rel="noopener" class="curator-strip-url">${esc(curatorUrl.replace('https://', ''))}</a>
      <p class="hero-collab">Curated by ${esc(curatorName)} &times; Independent Journalism Atlas</p>
    </div>
  `;
}

/* ── RENDER FILTER BAR ── */
function renderFilterBar() {
  const { creators } = PARTNER_CONFIG;
  const topics    = [...new Set(creators.map(c => c.topic))].sort();
  const platforms = [...new Set(creators.map(c => c.platform))].sort();

  function chipsHTML(values, dimension) {
    const allChip = `<button class="chip active" data-dimension="${esc(dimension)}" data-value="">All</button>`;
    const rest = values.map(v =>
      `<button class="chip" data-dimension="${esc(dimension)}" data-value="${esc(v)}">${esc(v)}</button>`
    ).join('');
    return allChip + rest;
  }

  const el = document.createElement('div');
  el.className = 'filter-bar';
  el.innerHTML = `
    <div class="filter-bar-inner">
      <div class="filter-row">
        <span class="filter-label">By topic</span>
        ${chipsHTML(topics, 'topic')}
      </div>
      <div class="filter-row">
        <span class="filter-label">By platform</span>
        ${chipsHTML(platforms, 'platform')}
      </div>
    </div>
  `;
  document.getElementById('filter-bar-mount').appendChild(el);
}

/* ── RENDER GRID ── */
function renderGrid() {
  document.getElementById('act-count-pill').textContent = `${PARTNER_CONFIG.creators.length} creators`;

  document.getElementById('creator-grid').innerHTML = PARTNER_CONFIG.creators.map(c => {
    const { icon, name: platformName } = getPlatformInfo(c.platform);
    const geoHTML        = c.geography  ? `<span class="pill">${esc(c.geography)}</span>`  : '';
    const topicHTML      = c.topic      ? `<span class="pill">${esc(c.topic)}</span>`      : '';
    const descriptorHTML = c.descriptor ? `<p class="creator-descriptor">${esc(c.descriptor)}</p>` : '';
    return `
      <div class="creator-card" data-topic="${esc(c.topic)}" data-platform="${esc(c.platform)}">
        <div class="creator-name">${esc(c.name)}</div>
        <div class="creator-channel">${esc(c.channel)}</div>
        ${descriptorHTML}
        <div class="creator-pills">
          ${geoHTML}
          ${topicHTML}
          <span class="pill platform">
            <span class="material-symbols-outlined">${icon}</span>${esc(platformName)}
          </span>
        </div>
        <hr class="card-divider">
        <a href="${esc(c.link)}" target="_blank" rel="noopener" class="card-link">Visit &rarr;</a>
      </div>
    `;
  }).join('');

  document.getElementById('atlas-attribution').innerHTML = `
    <span class="atlas-attribution-badge">Atlas Verified</span>
    <p class="atlas-attribution-body">
      Creators on this list are independently verified by the
      <a href="https://journalismatlas.com" target="_blank" rel="noopener">Independent Journalism Atlas</a> —
      a human-curated database of 1,400+ creator-journalists.
      <a href="https://journalismatlas.com/about-this-project" target="_blank" rel="noopener">How we verify &rarr;</a>
    </p>
  `;
}

/* ── RENDER ABOUT ── */
function renderAbout() {
  const { curatorName, logoColor, aboutHeadline, aboutParagraphs, aboutLinkText, aboutLinkUrl } = PARTNER_CONFIG;
  const logoHTML  = logoColor
    ? `<div class="about-logo"><img src="${esc(logoColor)}" alt="${esc(curatorName)}"></div>`
    : `<p class="about-text-name">${esc(curatorName)}</p>`;
  const parasHTML = aboutParagraphs.map(p => `<p class="about-body">${esc(p)}</p>`).join('');
  document.getElementById('about-inner').innerHTML = `
    ${logoHTML}
    <h2 class="about-headline">${esc(aboutHeadline)}</h2>
    ${parasHTML}
    <a href="${esc(aboutLinkUrl)}" target="_blank" rel="noopener" class="about-link">${esc(aboutLinkText)} &nearr;</a>
  `;
}

/* ── INIT FILTERS ── */
function initFilters() {
  const cards   = Array.from(document.querySelectorAll('.creator-card'));
  const countEl = document.getElementById('act-count-pill');
  const total   = cards.length;
  let activeTopic    = null;
  let activePlatform = null;

  function applyFilters() {
    let visible = 0;
    cards.forEach(card => {
      const topicMatch    = !activeTopic    || card.dataset.topic    === activeTopic;
      const platformMatch = !activePlatform || card.dataset.platform === activePlatform;
      const show = topicMatch && platformMatch;
      card.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    countEl.textContent = `${visible} of ${total} creators`;

    const emptyEl = document.getElementById('empty-state');
    if (visible === 0) {
      if (!emptyEl) {
        const el = document.createElement('p');
        el.id = 'empty-state';
        el.className = 'empty-state';
        el.textContent = 'No creators match these filters.';
        document.getElementById('creator-grid').appendChild(el);
      }
    } else if (emptyEl) {
      emptyEl.remove();
    }
  }

  function updateChipState(dimension, value) {
    document.querySelectorAll(`.chip[data-dimension="${dimension}"]`).forEach(chip => {
      chip.classList.toggle('active', chip.dataset.value === value);
    });
  }

  document.getElementById('filter-bar-mount').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const { dimension, value } = chip.dataset;

    if (dimension === 'topic') {
      activeTopic = (activeTopic === value || value === '') ? null : value;
      updateChipState('topic', activeTopic ?? '');
    } else if (dimension === 'platform') {
      activePlatform = (activePlatform === value || value === '') ? null : value;
      updateChipState('platform', activePlatform ?? '');
    }
    applyFilters();
  });

  applyFilters();
}

/* ── INIT ── */
document.addEventListener('DOMContentLoaded', () => {
  document.title = PARTNER_CONFIG.pageTitle;
  document.querySelector('meta[name="description"]').setAttribute('content', PARTNER_CONFIG.pageDescription);

  renderConsentBanner();
  renderHero();

  if (PARTNER_CONFIG.showFilters) {
    renderFilterBar();
  }

  renderGrid();
  renderAbout();

  if (PARTNER_CONFIG.showFilters) {
    initFilters();
  }
});
</script>
</body>
</html>
