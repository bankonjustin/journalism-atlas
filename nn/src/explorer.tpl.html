<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--HEAD-->
<style>
@font-face{font-family:"Inter Tight";src:url(data:font/woff2;base64,/*FONT*/) format("woff2");font-weight:500 800;font-style:normal;font-display:swap}
:root{--bg:#fff;--ink:#000;--ink-2:#3b3b3b;--ink-3:#6d6d6d;--rule:#d4d4d4;--panel:#000;--a:#F6C84E;--b:#B23A5E;--c:#A8A8A8;--focus:#000;--sel:#000;--selink:#fff;--font:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--ink:#fff;--ink-2:#d2d2d2;--ink-3:#8f8f8f;--rule:#2e2e2e;--focus:#fff;--sel:#fff;--selink:#000;color-scheme:dark}}
:root[data-theme=dark]{--bg:#000;--ink:#fff;--ink-2:#d2d2d2;--ink-3:#8f8f8f;--rule:#2e2e2e;--focus:#fff;--sel:#fff;--selink:#000;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font)}
.embed body,.embed{background:transparent}
.nn{max-width:/*MAXW*/px;margin:0 auto;padding:20px 16px 28px}
.embed .nn{padding:8px 8px 12px}
.eyebrow{font:600 12px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
h1{font:700 28px/1.1 var(--font);margin:0 0 6px}
.sub{margin:0 0 16px;color:var(--ink-2)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tab{font:600 14px/1 var(--font);padding:10px 14px;min-height:40px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:6px;cursor:pointer}
.tab[aria-selected=true]{background:var(--sel);color:var(--selink)}
.tab:hover{background:#FFC627;color:#000}
.tab:focus-visible,.li:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h2{font:700 20px/1.2 var(--font);margin:0 0 6px}
.sent{margin:0 0 6px;color:var(--ink-2);max-width:62ch}
.stat{margin:0 0 12px;font-weight:600}
.stage{position:relative;background:var(--panel);border-radius:6px;overflow:hidden}
canvas{display:block;width:100%}
.tip{position:absolute;pointer-events:none;background:rgba(0,0,0,.92);border:1px solid #444;color:#fff;border-radius:6px;padding:7px 9px;font:500 12px/1.35 var(--font);max-width:230px;z-index:2}
.tip b{display:block;font-weight:700;font-size:13px}
.tip span{display:block;color:#cfcfcf}
.legend{margin:0 0 8px;font-size:13px;color:var(--ink-2)}
.pos{margin:8px 0 0;font-size:13px;color:var(--ink-2)}.pos:empty{display:none}
.legend .row{display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;margin:0 0 6px}.legend .row>b{flex:none}.legend .row .sw{margin:0}
.legend svg.dash path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-dasharray:3 2}
.legend p{margin:0 0 6px}
.legend b{color:var(--ink)}
.legend .sw{display:inline-flex;align-items:center;gap:5px;margin-right:12px;white-space:nowrap}
.legend .gl{display:block;margin:2px 0}.legend .gl .sw{display:flex;white-space:normal;margin:3px 0}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.legend svg{width:14px;height:14px;flex:none;fill:currentColor;color:var(--ink-2)}
.list{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 16px;font-size:14px}
.li{display:flex;gap:6px;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--rule)}
.li .n{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.li .dot{align-self:center}
.li.off{opacity:.4}
.foot{margin:16px 0 0;font-size:13px;color:var(--ink-3)}
.flag{display:inline-block;font:600 11px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink-3);color:var(--ink-3);padding:4px 6px;border-radius:6px;margin-bottom:10px}
.stat:empty{display:none}
.hist{padding:14px 12px 8px}.hist[hidden]{display:none}.hist svg{display:block;width:100%;height:auto;overflow:visible}.hist text{font-family:var(--font);fill:#fff}
.hist text,.hist line{pointer-events:none}.hist .mk:focus{outline:none}.hist .mk:focus-visible .ring,.hist .mk:hover .ring{stroke:#fff;stroke-width:1.5;fill:none}
.chline{margin:0 0 6px;font:600 14px/1.35 var(--font);color:var(--ink-2);max-width:62ch}
.steps{display:flex;align-items:center;gap:6px;margin:0 0 10px}.steps .stl{font:600 11px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
.steps button{font:700 13px/1 var(--font);width:30px;height:30px;border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:6px;cursor:pointer}.steps button[aria-current=step]{background:var(--sel);color:var(--selink)}.steps button:hover{background:#FFC627;color:#000}.steps button:focus-visible,.see:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
details.key,details.explore{margin:0 0 10px}details summary{cursor:pointer;font:600 13px/1.2 var(--font);color:var(--ink-2);padding:6px 0}details[open]>summary{margin-bottom:4px}
.ann{position:absolute;left:0;top:0;pointer-events:none}.ann text{font-family:var(--font)}
.hist.dimmed .mk{opacity:.4}.hist .mk .hol{opacity:.5}.hist.dimmed .mk .hol{opacity:.85}
.shortv h2{font:700 30px/1.08 var(--font);margin:4px 0 10px;max-width:20ch}.enc{margin:0 0 14px;color:var(--ink-2);font-size:14px;max-width:62ch}
ol.chaps{list-style:none;margin:0;padding:0;display:grid;gap:12px}.chap{display:grid;grid-template-columns:minmax(96px,170px) 1fr;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.chap .th{background:#000;border-radius:6px;overflow:hidden;padding:4px}.chap .th canvas,.chap .th svg{display:block;width:100%}
.chap .n{margin:0 0 3px;font:700 12px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}.chap .sn{margin:0 0 6px;font:500 16px/1.35 var(--font)}.see{font:700 14px/1 var(--font);color:var(--ink)}
@media (max-width:520px){.shortv h2{font-size:25px}.chap{grid-template-columns:96px 1fr;gap:10px}.chap .sn{font-size:14px}}
.attr{margin:10px 0 0;font-size:12px;color:var(--ink-3)}.attr a{color:var(--ink);text-decoration:underline;font-weight:600}
.embed header,.embed .foot,.embed .flag{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:420px){h1{font-size:24px}.tab{padding:9px 11px;font-size:13px}}
</style>
</head>
<body>
<main class="nn">
<header>
  <p class="eyebrow" id="eyebrow"></p>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
</header>
<!--FLAG-->
<div class="tabs" role="tablist" aria-label="Explorer view" id="tabs"></div>
<section role="tabpanel" id="panel" aria-labelledby="t-cur">
  <div id="shortv" class="shortv" hidden></div>
  <div id="chapterv" hidden>
    <p class="chline" id="chline"></p>
    <nav class="steps" id="steps" aria-label="Chapters"></nav>
    <h2 id="title"></h2>
    <p class="sent" id="sent"></p>
    <p class="stat" id="stat"></p>
    <details class="key" id="key"><summary id="sumKey"></summary><div class="legend" id="legend"></div></details>
    <div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Explorer"></canvas><svg class="ann" id="ann" aria-hidden="true"></svg><div class="tip" id="tip" hidden></div></div>
    <div class="stage hist dimmed" id="hist" hidden><div class="tip" id="htip" hidden></div><div id="hsvg"></div></div>
    <p class="pos" id="pos"></p>
    <details class="explore" id="explore"><summary id="sumExp"></summary><ul class="list" id="list"></ul></details>
  </div>
  <p class="attr" id="attr"></p>
</section>
<p class="foot" id="foot"></p>
</main>
<script type="application/json" id="nn-data">/*DATA*/</script>
<script>
/*ENGINE*/
</script>
<script>
(() => {
const D = JSON.parse(document.getElementById('nn-data').textContent), M = D.meta, N = D.nodes, L = NN.build(D);
const qs = new URLSearchParams(location.search), EMBED = qs.get('embed') === '1';
if (EMBED) document.documentElement.classList.add('embed');
const $ = id => document.getElementById(id), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const CP = M.cp, fmt = (s, v) => s.replace(/\{(\w+)\}/g, (m, k) => v && k in v ? v[k] : m), cp = (k, v) => { if (!(k in CP)) throw new Error('missing copy ' + k); return v ? fmt(CP[k], v) : CP[k]; }, lc1 = s => s.charAt(0).toLowerCase() + s.slice(1);
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const T = { bg: '#000', a: '#F6C84E', b: '#B23A5E', c: '#A8A8A8', neutral: '#7C7C7C', ink: '#fff', ink2: '#bdbdbd', grid: '#262626' };
const cnt = f => N.filter(f).length, over = n => n.b === 2, pathIdx = k => M.paths.findIndex(p => p.key === k);
// ---- History numbers: every figure is derived from the data the page loads ----
const NUM = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const ERAS = [{ k: 'e0', label: 'Before ' + M.cut, lo: -1e9, hi: M.cut }, { k: 'e1', label: M.cut + '–2007', lo: M.cut, hi: 2008 }, { k: 'e2', label: '2008–2014', lo: 2008, hi: 2015 }, { k: 'e3', label: '2015 or later', lo: 2015, hi: 1e9 }];
const HS = (() => {
  const dated = N.filter(n => n.fy), pre = dated.filter(n => n.fy < M.cut), post = dated.filter(n => n.fy >= M.cut), o10 = n => n.b === 2;
  const eras = ERAS.map(e => { const m = dated.filter(n => n.fy >= e.lo && n.fy < e.hi), up = m.filter(o10); return { ...e, N: m.length, over: up.length, above: up.filter(n => n.o === 'INHERITED').length, grew: up.filter(n => n.o !== 'INHERITED').length }; });
  const k = M.cohorts.filter(c => pre.some(n => n.c === c.code)).length, u = N.length - dated.length;
  const a = pre.filter(o10).length, c = post.filter(o10).length;
  return { a, b: pre.length, c, d: post.length, k, u, eras, nCoh: M.cohorts.length,
    title: cp('chapter3.title'),
    dek: cp('chapter3.dek'),
    foot: cp('chapter3.foot') };
})();
// ---- v7: chapter copy. One source for the In short rows, the chapter lines, the headlines and the annotations; every figure derives from the loaded data ----
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const OV = N.filter(over), byC = M.cohorts.map(c => ({ ...c, n: cnt(x => x.c === c.code), up: cnt(x => x.c === c.code && over(x)), pre: cnt(x => x.c === c.code && x.fy && x.fy < M.cut) }));
const TOP = [...byC].sort((a, b) => b.up - a.up || a.n - b.n).slice(0, 4), TOPSET = new Set(TOP.map(c => c.code));
const upTop = TOP.reduce((a, c) => a + c.up, 0), upRest = OV.length - upTop, crossed = cnt(n => n.o === 'CROSSED'), viaPath = cnt(n => n.o === 'CROSSED' && pathIdx(n.m) >= 0);
const EXC = N.filter(n => n.m === 'EXCEPTION_PLATFORM_LICENSING'), STARTED = N.filter(n => n.o === 'INHERITED');
const TOTALS_AGREE = HS.a + HS.c === OV.length;                         // the In short total (over $10M) must equal History's before + since
const CH = [cp('chapter1.sentence'), cp('chapter2.sentence'), cp('chapter3.sentence')];
const TOPLINE = cp('in_short.top_line'), ENC = cp('in_short.encoding');
const TABS = [
  { id: 'short', param: 'short', engine: null, label: cp('tabs.short') },
  { id: 'governance', param: 'governance', engine: 'gov', ch: 1, label: cp('tabs.governance'), name: cp('chapter1.name'), title: cp('chapter1.title'), sent: cp('chapter1.paper'), line: CH[0] },
  { id: 'ways', param: 'ways', engine: 'ways', ch: 2, label: cp('tabs.ways'), name: cp('chapter2.name'), title: cp('chapter2.title'), sent: cp('chapter2.paper'), line: CH[1] },
  { id: 'history', param: 'history', engine: null, svg: true, ch: 3, label: cp('tabs.history'), name: cp('chapter3.name'), title: HS.title, sent: HS.dek, line: CH[2] },
];
const CHAPS = TABS.filter(t => t.ch), byParam = p => TABS.find(t => t.param === p || t.id === p);
let cur = (byParam(qs.get('tab')) || TABS[0]), P = NN.posOf(L, cur.engine || 'gov').map(p => ({ ...p })), mode = 'idle', hovered = null, userHl = null, dimOn = true, G, dpr = 1, measuring = false, fontsReady = false;
const cv = $('cv'), ctx = cv.getContext('2d'), stage = $('stage'), tip = $('tip'), root = document.querySelector('main');

$('sub').textContent = cp('header.sub'); $('eyebrow').textContent = cp('header.eyebrow'); $('h1').textContent = cp('header.title'); $('sumKey').textContent = cp('how_to_read.summary'); $('sumExp').textContent = cp('explore.summary');
const tabsEl = $('tabs');
tabsEl.innerHTML = TABS.map(t => `<button class="tab" role="tab" id="t-${t.id}" data-id="${t.id}" aria-selected="false" tabindex="-1">${esc(t.label)}</button>`).join('');
const tabBtns = [...tabsEl.children];
$('foot').textContent = cp('footer.data');
$('attr').innerHTML = esc(cp('attr.line')) + ' <a href="' + esc(M.report.url) + '">' + esc(M.report.label) + '<span aria-hidden="true"> →</span></a>';

const shapeSvg = s => s === 'ci' ? '<svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.2"/></svg>' : s === 'sq' ? '<svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="10" height="10"/></svg>' : '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5 13 12H1z"/></svg>';
const shapeSvgD = '<svg class="dash" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5 13 12H1z"/></svg>';
const PAGES = { history: HS.foot, governance: cp('chapter1.position'), ways: cp('chapter2.position') };
const bundleNote = () => (cnt(n => n.m === M.paths[0].key && n.o === 'CROSSED') === 0 && cnt(n => n.m === M.paths[0].key && n.o === 'INHERITED') > 0 ? cp('chapter2.bundle_note') : '');
function legend() {
  const colors = `<div class="row"><b>${esc(cp('legend.color'))}</b>${['a', 'b', 'c'].map(k => `<span class="sw"><i class="dot" style="background:var(--${k})"></i>${esc(M.groups[k])}</span>`).join('')}</div>`;
  const hasExc = EXC.length > 0, sA = esc(cp('legend.started_above')), gP = esc(cp('legend.grew_past')), gX = esc(cp('legend.grew_past_exception')), un = esc(cp('legend.under')), sh = `<b>${esc(cp('legend.shape'))}</b>`;
  if (cur.id === 'history') return colors + `<div class="row">${sh}<span class="sw">${shapeSvg('sq')}${sA}</span><span class="sw">${shapeSvg('tri')}${gP}</span>${hasExc ? `<span class="sw">${shapeSvgD}${gX}</span>` : ''}<span class="sw" style="opacity:.6">${shapeSvg('ci')}${esc(cp('legend.ten_or_under'))}</span></div>`;
  const ways = cur.id === 'ways';
  return colors + `<div class="row">${sh}<span class="sw"${ways ? ' style="opacity:.55"' : ''}>${shapeSvg('ci')}${un}</span>${ways ? '' : `<span class="sw">${shapeSvg('sq')}${sA}</span>`}<span class="sw">${shapeSvg('tri')}${gP}</span>${hasExc ? `<span class="sw">${shapeSvgD}${gX}</span>` : ''}</div>`;
}
function stat() {
  if (cur.id !== 'governance' && cur.id !== 'ways') return '';
  return cp(cur.id === 'governance' ? 'chapter1.stat' : 'chapter2.stat');
}
function listHtml() {
  const row = (key, dot, name, n, extra) => `<li class="li" tabindex="0" data-key="${esc(key)}">${dot ? `<i class="dot" style="background:var(--${dot})"></i>` : ''}<span><b>${name}</b>${extra ? ' ' + esc(extra) : ''}</span><span class="n">${n}</span></li>`;
  if (cur.id === 'governance') return M.cohorts.map(c => row(c.code, c.g, c.code + ' · ' + esc(c.name), cnt(n => n.c === c.code))).join('');
  if (cur.id === 'ways') return L.ways.geo.map((g, x) => x < 6 ? row(g.key, null, `${x + 1} · ${esc(M.paths[x].full)}`, g.members.length, x === 0 && bundleNote() ? '— ' + bundleNote() : '') : g.key === 'EXCEPTION_PLATFORM_LICENSING' ? row(g.key, null, cp('list.no_mechanism'), g.members.length, cp('list.no_mechanism_note')) : g.key === 'INHERITED_SCALE' ? row(g.key, null, cp('legend.started_above'), g.members.length) : row(g.key, null, cp('legend.under'), g.members.length)).join('');
  return '';
}
const effHl = () => userHl != null ? userHl : (dimOn && cur.id === 'governance' ? 'TOP' : null);
const hlKeyOf = n => cur.id === 'governance' ? (userHl != null ? n.c : TOPSET.has(n.c) ? 'TOP' : 'x') : NN.wayKey(n);
const isAnswer = n => (n.o === 'CROSSED' && pathIdx(n.m) >= 0) || n.m === 'EXCEPTION_PLATFORM_LICENSING';

// ---- In short: three rows, each with a thumbnail drawn by the same engine (only the highlighted element) ----
function thumbs() {
  document.querySelectorAll('[data-th]').forEach(el => {
    const k = el.dataset.th, w = Math.round(el.getBoundingClientRect().width) || 110;
    if (k === 'history') { el.innerHTML = eraThumb(w); return; }
    const c = el.querySelector('canvas'), d = Math.min(2, devicePixelRatio || 1), g = NN.geom(w, d, .86);
    const hk = k === 'gov' ? n => (TOPSET.has(n.c) ? 'H' : 'x') : n => (isAnswer(n) ? 'H' : 'x'), pos = L[k].pos, hs = N.filter(n => k === 'gov' || hk(n) === 'H').map(n => pos[n.i]);
    const x0 = Math.min(...hs.map(p => p.x)), x1 = Math.max(...hs.map(p => p.x)), y0 = Math.min(...hs.map(p => p.y)), y1 = Math.max(...hs.map(p => p.y)), pm = L.MR * 2.2;   // fit the highlighted marks to the thumbnail
    const fit = k === 'gov' ? .72 : .92, R2 = Math.min((g.w * fit) / (x1 - x0 + 2 * pm), (g.h * fit) / (y1 - y0 + 2 * pm)), base = g.R;
    const G2 = { ...g, R: R2, cx: g.w / 2 - (x0 + x1) / 2 * R2, cy: g.h / 2 - (y0 + y1) / 2 * R2, boost: g.boost * Math.min(1, base / R2 * 1.6) };
    c.width = Math.round(w * d); c.height = Math.round(g.h * d); c.style.height = g.h + 'px';
    NN.draw(c.getContext('2d'), G2, D, L, T, { tab: k, pos, ce: 1, chromeA: 0, labelA: k === 'gov' ? 1 : 0, labelsTab: k === 'gov' ? 'gov' : null, labelOn: key => TOPSET.has(key), labelOnly: true, mutedA: 0, hl: 'H', hlKeyOf: hk, dim: k === 'gov' ? .86 : 1 });
  });
}
function eraThumb(w) {
  const bmax = 64, h = bmax + 34, slot = w / HS.eras.length, bw = Math.min(26, slot * .6), base = bmax + 14;
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(HS.eras.map(e => cp('hist.era_aria', { label: e.label, over: e.over, n: e.N })).join('; '))}">` + HS.eras.map((e, i) => {
    const cx = slot * (i + .5), hg = e.grew / e.N * bmax, ha = e.above / e.N * bmax;
    return (ha ? `<rect x="${cx - bw / 2}" y="${base - ha}" width="${bw}" height="${ha}" fill="#fff" opacity=".35"/>` : '') + `<rect x="${cx - bw / 2}" y="${base - ha - hg}" width="${bw}" height="${hg}" fill="#fff"/><text x="${cx}" y="${base - ha - hg - 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" style="font-family:var(--font)">${Math.round(100 * e.over / e.N)}%</text>${w < 130 ? '' : `<text x="${cx}" y="${base + 13}" text-anchor="middle" font-size="9.5" fill="#bdbdbd" style="font-family:var(--font)">${esc(['<' + M.cut, String(M.cut).slice(2) + '–07', '08–14', '15+'][i])}</text>`}`;
  }).join('') + `<line x1="0" x2="${w}" y1="${base}" y2="${base}" stroke="#444"/></svg>`;
}
function shortHtml() {
  return `<h2 id="stTop">${esc(TOPLINE)}</h2><p class="enc">${esc(ENC)}</p><ol class="chaps">` + CHAPS.map((t, i) => `<li class="chap"><div class="th" data-th="${['gov', 'ways', 'history'][i]}"><canvas role="img" aria-label="${esc(cp('in_short.thumb_aria', { name: t.name }))}"></canvas></div><div class="tx"><p class="n">${esc(t.label)}</p><p class="sn">${esc(t.line)}</p><a class="see" href="?tab=${t.param}" data-go="${t.id}">${esc(cp('in_short.see_chart'))}<span aria-hidden="true"> →</span></a></div></li>`).join('') + '</ol>';
}
function ui() {
  tabBtns.forEach(b => { const on = b.dataset.id === cur.id; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; b.id = 't-' + b.dataset.id; });
  $('panel').setAttribute('aria-labelledby', 't-' + cur.id);
  const isS = cur.id === 'short', isH = cur.id === 'history';
  $('shortv').hidden = !isS; $('chapterv').hidden = isS;
  if (isS) {
    $('shortv').innerHTML = shortHtml(); thumbs();
    $('shortv').querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); go(byParam(a.dataset.go), true); }));
  } else {
    $('chline').textContent = cur.line;
